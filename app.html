<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{
  --bg:#FFFFFF; --page:#F4EFEA; --surface:#F7F3EF; --card:#FFFFFF; --line:#ECE3DA;
  --ink:#1C1410; --muted:#6A5A50; --brand:#F29835; --brand-deep:#D9771A; --brand-ink:#14100D; --brand-text:#A84F07;
  --disc:#FDE7CB; --ok:#1F8A4C; --ok-bg:#E3F4EA; --danger:#B42318; --danger-bg:#FDECEA;
  --display:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;
  --ar:'Alexandria','Geeza Pro','Segoe UI',Tahoma,sans-serif;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --shadow:0 10px 30px rgba(28,20,16,.10);
  --tab-h:68px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141110; --page:#0D0B0A; --surface:#1E1916; --card:#1E1916; --line:#33291F; --ink:#FFF4E6; --muted:#C9BBAE;
  --brand-text:#F7B060; --disc:#3A2A1A; --ok-bg:#163223; --danger-bg:#3A1714; --shadow:0 10px 30px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{--bg:#141110; --page:#0D0B0A; --surface:#1E1916; --card:#1E1916; --line:#33291F; --ink:#FFF4E6; --muted:#C9BBAE; --brand-text:#F7B060; --disc:#3A2A1A; --ok-bg:#163223; --danger-bg:#3A1714}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--page)}
html,body{overflow-x:hidden}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--ar);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:10px}
.lat{font-family:var(--display);direction:ltr;unicode-bidi:isolate}
[hidden]{display:none !important}

/* phone shell */
#app{position:relative;max-width:520px;min-height:100vh;min-height:100dvh;margin:0 auto;background:var(--bg);box-shadow:0 0 0 1px var(--line)}
#view{padding-bottom:calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px))}
#app.noTabs #view{padding-bottom:24px}
.pad{padding-left:18px;padding-right:18px}

/* demo banner */
.demo{background:var(--ink);color:var(--bg);font-size:12.5px;text-align:center;padding:6px 12px;padding-top:calc(6px + env(safe-area-inset-top,0px))}

/* splash */
#splash{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity .45s ease, visibility .45s}
#splash.out{opacity:0;visibility:hidden}
.sp-disc{position:absolute;width:150vmax;height:150vmax;border-radius:50%;background:var(--brand);left:50%;top:58%;transform:translate(-50%,-50%) scale(0);animation:spDisc .9s cubic-bezier(.2,.8,.2,1) .15s forwards}
@keyframes spDisc{to{transform:translate(-50%,-50%) scale(.42)}}
.sp-stage{position:relative;width:min(78vw,380px);aspect-ratio:1/1.05;display:flex;align-items:flex-end;justify-content:center}
.sp-burger{position:relative;width:62%;transform:translateY(-120vh) rotate(-8deg);animation:spDrop .85s cubic-bezier(.3,1.35,.5,1) .55s forwards;filter:drop-shadow(0 22px 22px rgba(0,0,0,.25))}
@keyframes spDrop{to{transform:translateY(0) rotate(-3deg)}}
.sp-scoot{position:absolute;bottom:0;left:-8%;width:44%;transform:translateX(140vw);animation:spRide 1.1s cubic-bezier(.25,.8,.3,1) .3s forwards}
@keyframes spRide{to{transform:translateX(0)}}
.sp-brand{position:relative;margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;transform:translateY(14px);animation:spUp .6s ease 1.25s forwards}
.sp-brand img{width:132px;background:#fff;border-radius:22px;padding:10px 14px}
.sp-brand p{margin:0;color:var(--brand-ink);font-weight:700;font-size:15px}
@keyframes spUp{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .sp-disc{animation:none;transform:translate(-50%,-50%) scale(.42)}
  .sp-burger,.sp-scoot,.sp-brand{animation:none;transform:none;opacity:1}
}

/* top hero header (home) */
.top{position:relative;background:var(--brand);color:var(--brand-ink);padding:calc(14px + env(safe-area-inset-top,0px)) 18px 74px;border-radius:0 0 34px 34px;overflow:hidden}
.top::after{content:"";position:absolute;width:320px;height:320px;border-radius:50%;border:2px solid rgba(20,16,13,.12);inset-inline-start:-110px;top:-150px}
.toprow{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px}
.loc{appearance:none;border:0;background:rgba(255,255,255,.28);border-radius:999px;padding:7px 12px 7px 10px;display:flex;align-items:center;gap:8px;max-width:76%;text-align:start}
.loc small{display:block;font-size:11px;opacity:.8;line-height:1.2}
.loc b{display:block;font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{appearance:none;border:0;width:42px;height:42px;border-radius:50%;background:#fff;color:var(--brand-ink);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.hello{position:relative;margin:16px 0 12px;font-size:26px;line-height:1.25;font-weight:800}
.hello span{display:block;font-size:15px;font-weight:500;opacity:.85}
.search{position:relative;display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:0 14px;height:50px;color:#1C1410}
.search input{flex:1;border:0;background:transparent;outline:none;font-size:15px;height:100%;color:#1C1410}
.search input::placeholder{color:#8A7A70}

/* banners */
.banners{position:relative;margin-top:-56px;z-index:2}
.btrack{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 18px 6px;scrollbar-width:none}
.btrack::-webkit-scrollbar{display:none}
.bn{flex:0 0 calc(100% - 28px);scroll-snap-align:center;position:relative;border-radius:var(--r-lg);min-height:168px;padding:20px 20px 18px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);border:0;text-align:start}
.bn h3{margin:0;font-size:24px;line-height:1.15;font-weight:800;max-width:58%}
.bn p{margin:6px 0 0;font-size:13.5px;max-width:56%;line-height:1.45}
.bn .cta{align-self:flex-start;margin-top:12px;border-radius:999px;padding:8px 16px;font-weight:700;font-size:13.5px}
.bn img{position:absolute;inset-inline-end:-14px;bottom:-10px;width:48%;max-height:96%;object-fit:contain;filter:drop-shadow(0 14px 16px rgba(0,0,0,.28))}
.bn.ink{background:#1C1410;color:#FFF4E6}.bn.ink .cta{background:var(--brand);color:var(--brand-ink)}
.bn.org{background:#FDE7CB;color:#1C1410}.bn.org .cta{background:#1C1410;color:#FFF4E6}
.bn.org img.photo{width:44%;height:76%;bottom:12%;inset-inline-end:16px;object-fit:cover;border-radius:18px;filter:none;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.bn.wht{background:#fff;color:#1C1410;border:2px solid var(--brand)}.bn.wht .cta{background:var(--brand);color:var(--brand-ink)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--line);transition:width .25s,background .25s}
.dots i.on{width:20px;background:var(--brand)}

/* sections */
.sec{margin-top:24px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.sech h2{margin:0;font-size:19px;font-weight:800}
.sech a,.linkbtn{color:var(--brand-text);font-weight:700;font-size:14px;text-decoration:none;background:none;border:0;padding:0}

.cats{display:flex;gap:12px;overflow-x:auto;padding:0 18px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;width:78px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.cat .ci{width:72px;height:72px;border-radius:24px;background:var(--surface);display:flex;align-items:center;justify-content:center;padding:6px}
.cat .ci img{max-height:100%;object-fit:contain}

/* ---------------- demo backend (preview only) ---------------- */
var D={cust:null,orders:[],addrs:[],seq:1040};
function demo(fn,b){
  var now=new Date().toISOString();
  switch(fn){
    case 'app_branches':return S.branches;
    case 'app_signup':if(!/^\d{4}$/.test(b.pin||''))return{ok:false,error:'bad_pin_format'};if(!b.name||b.name.trim().length<2)return{ok:false,error:'bad_name'};if(!normPhone(b.phone))return{ok:false,error:'bad_phone'};D.cust={name:b.name.trim(),phone:normPhone(b.phone),pin:b.pin};return{ok:true,token:'demo'};
    case 'app_login':if(!normPhone(b.phone))return{ok:false,error:'bad_phone'};if(!D.cust){D.cust={name:'ضيف RQ',phone:normPhone(b.phone),pin:b.pin};}return{ok:true,token:'demo'};
    case 'app_me':if(!D.cust)return{ok:false,error:'auth'};return{ok:true,customer:{name:D.cust.name,phone:D.cust.phone,orders:D.orders.length},addresses:D.addrs};
    case 'app_logout':D.cust=null;return{ok:true};
    case 'app_delete_account':D.cust=null;return{ok:true};
    case 'app_push_register':case 'app_push_unregister':return{ok:true};
    case 'app_update_name':D.cust.name=b.name;return{ok:true};
    case 'app_save_address':if(!b.a.area||b.a.area.trim().length<2)return{ok:false,error:'bad_address'};if(b.a.lat==null||b.a.lng==null)return{ok:false,error:'no_location'};var a={id:'a'+Date.now(),label:b.a.label||'البيت',area:b.a.area,details:b.a.details||'',lat:b.a.lat,lng:b.a.lng};D.addrs.unshift(a);return{ok:true,id:a.id};
    case 'app_remove_address':D.addrs=D.addrs.filter(function(x){return x.id!==b.address_id;});return{ok:true};
    case 'app_place_order':
      var o=b.o,br=S.branches.find(function(x){return x.id===o.branch_id;}),sub=0;
      var items=o.items.map(function(l){var it=S.byId[l.id];sub+=it.price*l.qty;return{item_id:l.id,name:it.name,price:it.price,qty:l.qty,note:l.note||''};});
      var fee=o.kind==='delivery'?br.delivery_fee:0;
      if(o.kind==='delivery'&&sub<br.min_order)return{ok:false,error:'below_min'};
      var ord={id:'o'+Date.now(),order_no:++D.seq,branch_id:br.id,kind:o.kind,status:'new',payment:o.payment,name:D.cust.name,phone:D.cust.phone,address:o.kind==='delivery'?D.addrs.find(function(x){return x.id===o.address_id;}):null,notes:o.notes,subtotal:sub,delivery_fee:fee,total:sub+fee,eta_minutes:null,history:[{s:'new',at:now}],created_at:now,items:items,_t:Date.now()};
      D.orders.unshift(ord);return{ok:true,id:ord.id,order_no:ord.order_no};
    case 'app_my_orders':D.orders.forEach(demoAdvance);return{ok:true,orders:D.orders};
    case 'app_order':var f=D.orders.find(function(x){return x.id===b.order_id;});if(!f)return{ok:false,error:'not_found'};demoAdvance(f);return{ok:true,order:f};
    case 'app_cancel_order':var g=D.orders.find(function(x){return x.id===b.order_id;});if(g.status!=='new')return{ok:false,error:'too_late'};g.status='cancelled';g.cancel_reason='ألغاه العميل';return{ok:true};
  }
  return{ok:false,error:'net'};
}
function demoAdvance(o){if(o.status==='cancelled')return;var flow=o.kind==='delivery'?['new','accepted','preparing','on_way','delivered']:['new','accepted','preparing','ready','picked_up'];var el=(Date.now()-o._t)/9000,i=Math.min(flow.length-1,Math.floor(el));if(flow.indexOf(o.status)<i){o.status=flow[i];o.eta_minutes=o.kind==='delivery'?35:15;}
  if(o.kind==='delivery'&&i>=1){var f=Math.max(0,Math.min(1,el-3));var a=o.address||{};if(a.lat==null){a.lat=24.3291;a.lng=54.5470;o.address=a;}o.driver={name:'محمد',phone:'971500000000',lat:o.status==='on_way'?24.3372+(a.lat-24.3372)*f:null,lng:o.status==='on_way'?54.5559+(a.lng-54.5559)*f:null};}}
function normPhone(p){var d=String(p||'').replace(/\D/g,'');if(/^05\d{8}$/.test(d))return '971'+d.slice(1);if(/^5\d{8}$/.test(d))return '971'+d;if(/^9715\d{8}$/.test(d))return d;if(/^009715\d{8}$/.test(d))return d.slice(2);return null;}

/* ---------------- data load ---------------- */
function applyMenu(cats,items,branches){
  S.cats=cats.slice().sort(function(a,b){return a.sort-b.sort;});
  S.items=items.filter(function(i){return i.active!==false;}).map(function(i){i.price=Number(i.price);return i;}).sort(function(a,b){return a.sort-b.sort;});
  S.byId={};S.items.forEach(function(i){S.byId[i.id]=i;});
  S.cats=S.cats.filter(function(c){return S.items.some(function(i){return i.category_id===c.id;});});
  S.branches=branches.slice().sort(function(a,b){return a.sort-b.sort;});
  if(S.branch&&!branch())S.branch=null;
  if(!S.branch){var ob=S.branches.find(isOpen)||S.branches[0];S.branch=ob&&ob.id;}
  S.cart=S.cart.filter(function(l){return S.byId[l.id];});saveCart();
}
function loadMenu(){
  return Promise.all([rest('menu_categories?select=*'),rest('menu_items?select=*&active=eq.true'),rpc('app_branches')])
    .then(function(r){applyMenu(r[0],r[1],r[2]);store.set('rqa-menu',{c:r[0],i:r[1],b:r[2]});})
    .catch(function(){

      if(preview){DEMO=true;$('#demo').hidden=false;var s=JSON.parse($('#snap').textContent);applyMenu(s.categories,s.items,s.branches);return;}

      if(window.RQ_NATIVE){try{var sn=JSON.parse($('#snap').textContent);applyMenu(sn.categories,sn.items,sn.branches);setTimeout(function(){toast('ما فيه اتصال. نعرض المنيو المحفوظ.');},2600);return;}catch(e){}}

    });
}

function placeOrder(){

  var o={branch_id:b.id,kind:S.mode,payment:S.pay,address_id:S.mode==='delivery'?S.addr:null,notes:V.cart.notes||'',items:S.cart.map(function(l){return{id:l.id,qty:l.qty,note:l.note};})};

    if(r&&r.ok){S.cart=[];saveCart();V.cart.notes='';S.orders=null;go('#/order/'+r.id+'/new');return;}

}

function closeSheet(){sheet.classList.remove('open');document.body.style.overflow='';if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});}
sheet.addEventListener('click',function(e){if(e.target.hasAttribute('data-close'))closeSheet();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheet.classList.contains('open'))closeSheet();});

function itemSheet(id){var it=S.byId[id];if(!it)return;var q=1,photo=/combo_photo/.test(it.image||'');
  openSheet((it.image?'<div class="ihero'+(photo?' photo':'')+'"><img src="'+esc(IMG(it.image))+'" alt="'+esc(it.name)+'"></div>':'')+
    '<div class="iname">'+esc(it.name)+'</div>'+(it.ingredients?'<p class="iing">'+esc(it.ingredients)+'</p>':'')+
    '<label class="lbl" for="inote">ملاحظة للمطبخ (اختياري)</label><input class="f" id="inote" maxlength="120" placeholder="مثلاً: بدون بصل">'+
    '<div class="addbar"><span class="step"><button type="button" id="iplus" aria-label="زيادة">+</button><output id="iq">1</output><button type="button" id="iminus" aria-label="إنقاص">−</button></span>'+
    '<button type="button" class="btn pri" id="iadd">أضف للسلة · <span class="lat" id="itot">'+money(it.price)+' AED</span></button></div>',
  function(){var upd=function(){$('#iq').textContent=q;$('#itot').textContent=money(it.price*q)+' AED';};
    $('#iplus').onclick=function(){if(q<50){q++;upd();}};$('#iminus').onclick=function(){if(q>1){q--;upd();}};
    $('#iadd').onclick=function(){addToCart(id,q,$('#inote').value);closeSheet();toast('أُضيف '+it.name);render(true);};});
}
function modeSheet(){
  var h='<h2>كيف تبي تستلم طلبك؟</h2><div class="seg" style="margin-bottom:14px"><label><input type="radio" name="sm" value="delivery"'+(S.mode==='delivery'?' checked':'')+'><span>توصيل</span></label><label><input type="radio" name="sm" value="pickup"'+(S.mode==='pickup'?' checked':'')+'><span>استلام من الفرع</span></label></div>'+
    '<label class="lbl">الفرع</label><div class="brs">'+S.branches.map(function(x){return '<label class="addr"><input type="radio" name="sb" value="'+esc(x.id)+'"'+(x.id===S.branch?' checked':'')+'><div style="flex:1"><b>'+esc(x.name_ar)+'</b><small class="lat" style="text-align:right">'+esc(x.address)+'</small></div>'+brStatus(x)+'</label>';}).join('')+'</div>';
  if(S.token&&S.addresses.length)h+='<label class="lbl" style="margin-top:14px">عنوان التوصيل</label>'+S.addresses.map(function(a){return '<label class="addr"><input type="radio" name="sa" value="'+esc(a.id)+'"'+(a.id===S.addr?' checked':'')+'><div><b>'+esc(a.label)+'</b><small>'+esc(a.area)+'</small></div></label>';}).join('');
  h+='<button type="button" class="btn pri block" id="smok" style="margin-top:16px">تم</button>';
  openSheet(h,function(){$('#smok').onclick=function(){var m=panel.querySelector('[name=sm]:checked'),b=panel.querySelector('[name=sb]:checked'),a=panel.querySelector('[name=sa]:checked');if(m){S.mode=m.value;store.set('rqa-mode',S.mode);}if(b){S.branch=b.value;store.set('rqa-branch',S.branch);}if(a){S.addr=a.value;store.set('rqa-addr',S.addr);}closeSheet();render();};});
}
function addressSheet(){
  if(!S.token){S.after=location.hash;go('#/login');return;}
  var lat=null,lng=null,pinned=false,map=null;
  openSheet('<h2>عنوان جديد</h2>'+
    '<div class="amapw"><div class="amap" id="amap" role="application" aria-label="حرّك الخريطة لين يكون الدبوس على بيتك"></div><span class="apin" aria-hidden="true">'+ICON.pin+'</span>'+
      '<button type="button" class="btn sm dark agps" id="ageo">'+ICON.pin+' موقعي الحالي</button></div>'+
    '<p id="ageoS" class="ageoS">حرّك الخريطة لين يكون الدبوس فوق بيتك بالضبط.</p>'+
    '<div class="seg" style="margin:12px 0 14px">'+['البيت','الشغل','غيره'].map(function(l,i){return '<label><input type="radio" name="al" value="'+l+'"'+(i?'':' checked')+'><span>'+l+'</span></label>';}).join('')+'</div>'+
    '<div class="fgroup"><label class="lbl" for="aarea">المنطقة</label><input class="f" id="aarea" maxlength="120" placeholder="مثلاً: مدينة محمد بن زايد، زون 12"></div>'+
    '<div class="fgroup"><label class="lbl" for="adet">تفاصيل العنوان</label><textarea class="f" id="adet" rows="2" maxlength="300" placeholder="رقم الفيلا أو المبنى، الشقة، علامة مميزة"></textarea></div>'+
    '<button type="button" class="btn pri block" id="asave">احفظ العنوان</button><div class="err" id="aerr" role="alert"></div>',
  function(){
    var S_=$('#ageoS');
    function setPin(a,b,msg){lat=Math.round(a*1e6)/1e6;lng=Math.round(b*1e6)/1e6;pinned=true;S_.style.color='var(--ok)';S_.textContent=msg||'تم تحديد الموقع. السائق بيوصل لهالنقطة بالضبط.';$('#aerr').textContent='';}
    function gps(){if(!navigator.geolocation){S_.textContent='جوالك ما يدعم تحديد الموقع. حرّك الخريطة على بيتك.';return;}S_.style.color='';S_.textContent='نحدد موقعك…';
      navigator.geolocation.getCurrentPosition(function(p){var a=p.coords.latitude,b=p.coords.longitude;if(map){map.setView([a,b],17);}setPin(a,b,map?'هذا موقعك الحالي. عدّل الدبوس لو مو على بيتك بالضبط.':null);},
        function(){S_.style.color='var(--danger)';S_.textContent='ما قدرنا نحدد موقعك. اسمح للمتصفح بالوصول للموقع، أو حرّك الخريطة على بيتك.';},{enableHighAccuracy:true,timeout:12000,maximumAge:30000});}
    $('#ageo').onclick=gps;
    loadLeaflet().then(function(L){var el=$('#amap');if(!el)return;
      map=L.map(el,{zoomControl:false,attributionControl:true}).setView([24.4539,54.3773],11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
      var user=false;map.on('dragstart zoomstart',function(){user=true;});
      map.on('moveend',function(){if(!user)return;var c=map.getCenter();setPin(c.lat,c.lng);});
      setTimeout(function(){map.invalidateSize();},250);
      gps();
    }).catch(function(){var w=$('.amapw');if(w)w.outerHTML='<button type="button" class="btn line block" id="ageo2">'+ICON.pin+' حدّد موقعي</button>';var b=$('#ageo2');if(b)b.onclick=gps;S_.textContent='اضغط "حدّد موقعي" وأنت في البيت. بدون الموقع ما نقدر نوصّل.';gps();});
    $('#asave').onclick=function(){var area=$('#aarea').value.trim(),E=$('#aerr');E.textContent='';
      if(!pinned){E.textContent=ERR.no_location;return;}
      if(area.length<2){E.textContent=ERR.bad_address;return;}
      var b=this;b.disabled=true;rpc('app_save_address',{t:S.token,a:{label:panel.querySelector('[name=al]:checked').value,area:area,details:$('#adet').value.trim(),lat:lat,lng:lng}}).then(function(r){
        if(r&&r.ok){S.addr=r.id;store.set('rqa-addr',S.addr);return loadMe().then(function(){S.addr=r.id;closeSheet();toast('تم حفظ العنوان');render();});}E.textContent=emsg(r&&r.error);}).catch(function(){E.textContent=ERR.net;}).finally(function(){b.disabled=false;});};
  });
}

/* ---------------- global clicks ---------------- */
document.addEventListener('click',function(e){
  var t;
  if((t=e.target.closest('[data-quick]'))){var id=t.dataset.quick;addToCart(id,1,'');toast('أُضيف '+S.byId[id].name);render(true);return;}
  if((t=e.target.closest('[data-item]'))){itemSheet(t.dataset.item);return;}
  if((t=e.target.closest('[data-line]'))){var l=S.cart.find(function(x){return x.k===t.dataset.line;});if(l){setLine(l.k,l.qty+Number(t.dataset.d));render(true);}return;}
  if((t=e.target.closest('[data-sheet]'))){if(t.dataset.sheet==='mode')modeSheet();else addressSheet();return;}
  if((t=e.target.closest('[data-go]'))){go(t.dataset.go);return;}
  if((t=e.target.closest('[data-back]'))){if(history.length>1)history.back();else go('#/home');return;}
  if((t=e.target.closest('[data-after]'))){S.after=t.dataset.after;}
  if((t=e.target.closest('[data-reorder]'))){var o=(S.orders||[]).find(function(x){return x.id===t.dataset.reorder;});if(!o)return;var n=0;o.items.forEach(function(i){if(S.byId[i.item_id]){addToCart(i.item_id,i.qty,i.note||'');n++;}});
    if(o.branch_id)S.branch=o.branch_id;S.mode=o.kind;store.set('rqa-mode',S.mode);store.set('rqa-branch',S.branch);toast(n?'رجّعنا أصناف الطلب للسلة':'أصناف هالطلب ما عادت متوفرة');if(n)go('#/cart');return;}
  if((t=e.target.closest('[data-cancel]'))){if(!confirm('متأكد تبي تلغي الطلب؟'))return;rpc('app_cancel_order',{t:S.token,order_id:t.dataset.cancel}).then(function(r){if(r&&r.ok){toast('تم إلغاء الطلب');render();}else toast(emsg(r&&r.error));}).catch(function(){toast(ERR.net);});return;}
});
document.addEventListener('submit',function(e){var f=e.target.closest('[data-search]');if(!f)return;e.preventDefault();V.menu.q=f.q.value;if(location.hash.indexOf('#/menu')===0)render();else go('#/menu');});
document.addEventListener('input',function(e){if(e.target.closest('[data-search]')&&location.hash.indexOf('#/menu')===0){V.menu.q=e.target.value;clearTimeout(V.menu.d);V.menu.d=setTimeout(function(){var pos=e.target.selectionStart;render();var i=$('[data-search] input');if(i){i.focus();try{i.setSelectionRange(pos,pos);}catch(x){}}},250);}});

/* ---------------- router ---------------- */
function go(h){if(location.hash===h)render();else location.hash=h;}
function updateBadges(){var n=cartCount(),b=$('#tabBdg');b.hidden=!n;b.textContent=n;var r=route();var cb=$('#cartbar');cb.hidden=!n||r.name==='cart'||r.name==='login'||r.name==='order';$('#cbN').textContent=n;$('#cbT').textContent=money(cartSub())+' AED';}
function route(){var h=(location.hash||'#/home').replace(/^#\//,'');var i=h.indexOf('/');return{name:i>-1?h.slice(0,i):h,arg:i>-1?h.slice(i+1):''};}
function render(keepScroll){
  var r=route();if(!V[r.name]){go('#/home');return;}
  if(r.name==='login'&&S.token){go('#/account');return;}
  var y=window.scrollY;
  if(V.menu.io){V.menu.io.disconnect();V.menu.io=null;}
  var view=$('#view'),nv=view.cloneNode(false);view.parentNode.replaceChild(nv,view);
  nv.innerHTML=V[r.name](r.arg);
  var noTabs=r.name==='login'||r.name==='order';
  $('#tabbar').hidden=noTabs;$('#app').classList.toggle('noTabs',noTabs);
  document.querySelectorAll('.tabbar a').forEach(function(a){a.classList.toggle('on',a.dataset.tab===r.name||(r.name==='order'&&a.dataset.tab==='orders'));});
  if(V[r.name].after)V[r.name].after(r.arg);
  updateBadges();
  if(keepScroll)window.scrollTo(0,y);else if(!(r.name==='menu'&&r.arg))window.scrollTo(0,0);
}
window.addEventListener('hashchange',function(){if(sheet.classList.contains('open'))closeSheet();render();});

/* ---------------- boot ---------------- */
var splash=$('#splash'),t0=Date.now(),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,seen=false;
try{seen=sessionStorage.getItem('rqa-splash')==='1';}catch(e){}
var minSplash=seen?300:(reduce?800:2300);
function hideSplash(){splash.classList.add('out');try{sessionStorage.setItem('rqa-splash','1');}catch(e){}setTimeout(function(){splash.remove();},500);}
splash.addEventListener('click',function(){minSplash=0;});
loadMenu().then(loadMe).then(function(){
  if(OFFLINE){$('#tabbar').hidden=true;$('#view').innerHTML='<div class="empty" style="padding-top:30vh">'+ICON.bagBig+'<h3>تعذّر تحميل المنيو</h3><p>تأكد من الإنترنت وجرّب مرة ثانية.</p><button type="button" class="btn pri" onclick="location.reload()" style="margin-top:12px">إعادة المحاولة</button></div>';setTimeout(hideSplash,300);return;}
  if(!location.hash||location.hash==='#'||location.hash==='#/')location.replace(S.token?'#/home':'#/login');
  render();
  var wait=Math.max(0,minSplash-(Date.now()-t0));setTimeout(hideSplash,wait);
});
setInterval(function(){if(DEMO)return;rpc('app_branches').then(function(b){if(Array.isArray(b)){S.branches=b.sort(function(x,y){return x.sort-y.sort;});}}).catch(function(){});},120000);
})();
</script>
