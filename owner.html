<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RQ Owner — لوحة المالك</title>
<meta name="theme-color" content="#0c0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RQ Owner">
<link rel="manifest" href="/owner.webmanifest">
<link rel="icon" href="/owner-192.png">
<link rel="apple-touch-icon" href="/owner-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c0e;--surface:#151518;--surface2:#1c1c20;--line:#26262c;--ink:#f4f4f5;--ink2:#b4b4bd;--ink3:#7c7c87;
  --brand:#f47a20;--brand2:#ff9a4d;--brandbg:rgba(244,122,32,.13);
  --good:#22c55e;--goodbg:rgba(34,197,94,.13);--bad:#ef4444;--badbg:rgba(239,68,68,.13);--warn:#eab308;--warnbg:rgba(234,179,8,.14);
  --grid:#24242a;--r:18px;--shadow:0 1px 0 rgba(255,255,255,.03) inset;
}
html.light{--bg:#f4f4f6;--surface:#fff;--surface2:#f3f3f6;--line:#e6e6ec;--ink:#141417;--ink2:#4b4b55;--ink3:#80808c;--grid:#ececf1;--brand2:#d9600a;--shadow:0 1px 2px rgba(20,20,30,.05);--good:#15803d;--bad:#dc2626;--warn:#a16207}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:15px}
body{min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
input:focus,select:focus{border-color:var(--brand)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
[hidden]{display:none!important}
.muted{color:var(--ink3)}

/* ---------- login ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(120% 70% at 50% 0%,#2a1708 0%,var(--bg) 60%);z-index:50}
html.light #login{background:radial-gradient(120% 70% at 50% 0%,#ffe6d1 0%,var(--bg) 60%)}
.lbox{width:100%;max-width:330px;text-align:center}
.brandmark{display:flex;align-items:baseline;justify-content:center;gap:8px;direction:ltr}
.brandmark .rq{font-family:Pacifico,cursive;color:var(--brand);font-size:46px;line-height:1}
.brandmark .k{font-weight:700;letter-spacing:4px;font-size:15px;color:var(--ink2)}
.lbox h1{font-size:19px;margin:14px 0 4px}
.lbox p{margin:0 0 22px;color:var(--ink3);font-size:13px}
.dots{display:flex;justify-content:center;gap:12px;margin-bottom:10px;direction:ltr;min-height:16px}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--ink3);transition:.12s}
.dots i.on{background:var(--brand);border-color:var(--brand)}
.lerr{color:var(--bad);min-height:20px;font-size:13px;margin-bottom:8px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;direction:ltr}
.pad button{height:62px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:23px;font-weight:600}
.pad button:active{background:var(--brandbg);border-color:var(--brand)}
.shake{animation:shake .35s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topin{max-width:1240px;margin:0 auto;padding:12px 16px 10px;display:flex;flex-direction:column;gap:10px}
.trow{display:flex;align-items:center;gap:10px}
.trow h2{margin:0;font-size:19px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .mlogo{display:flex;align-items:baseline;gap:5px;direction:ltr}
.trow .mlogo .rq{font-family:Pacifico,cursive;color:var(--brand);font-size:24px;line-height:1}
.ibtn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);color:var(--ink2);flex-shrink:0}
.ibtn.spin svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--goodbg)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink2);font-size:13.5px;font-weight:600;flex-shrink:0}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.ghost.on{background:var(--brandbg);color:var(--brand2)}
.crange{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crange input{padding:8px 10px;font-size:14px}
.content{max-width:1240px;margin:0 auto;padding:16px}
.plabel{font-size:12.5px;color:var(--ink3);margin:-2px 2px 12px}

/* ---------- cards ---------- */
.grid{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 2px;font-size:15px;font-weight:700}
.card .sub{font-size:12.5px;color:var(--ink3);margin-bottom:14px}
.chead{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}.chead>div{flex:1;min-width:0}.chead .sub{margin:0}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 18%,var(--surface)) 0%,var(--surface) 70%);border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}
.hero .lbl{font-size:13px;color:var(--ink2);font-weight:600}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-.5px;line-height:1.15;margin:6px 0 10px}
.hero .big small{font-size:16px;color:var(--ink2);font-weight:600;margin-inline-start:4px}
.deltas{display:flex;gap:8px;flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--ink2)}
.delta.up{background:var(--goodbg);color:var(--good)}.delta.down{background:var(--badbg);color:var(--bad)}
.delta b{font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi .l{font-size:12.5px;color:var(--ink3);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:23px;font-weight:700;margin-top:6px}
.kpi .v small{font-size:12px;color:var(--ink3);font-weight:600;margin-inline-start:3px}
.kpi .s{font-size:12px;color:var(--ink3);margin-top:3px}
.split{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px;margin:12px 0 8px;background:var(--surface2)}
.split i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}

/* ---------- charts ---------- */
.chart{position:relative;width:100%;direction:ltr}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:7px 10px;font-size:12.5px;line-height:1.45;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity .1s;z-index:5;direction:rtl;font-weight:500}
.tip b{font-weight:700}.tip.on{opacity:1}
.ax{fill:var(--ink3);font-size:11px;font-family:inherit}
.hbars .row{display:grid;grid-template-columns:minmax(78px,30%) 1fr auto;align-items:center;gap:10px;padding:7px 0}
.hbars .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbars .tr{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.hbars .tr i{display:block;height:100%;background:var(--brand);border-radius:99px;min-width:2px}
.hbars .vv{font-size:13px;font-weight:700;text-align:end;min-width:76px}
.hbars .vv small{display:block;font-size:11px;font-weight:600;color:var(--ink3)}
.heat{display:grid;gap:3px;direction:ltr}
.heat .c{aspect-ratio:1;border-radius:4px;background:var(--surface2)}
.heat .hl{font-size:10.5px;color:var(--ink3);text-align:center}
.heat .wl{font-size:11px;color:var(--ink3);display:flex;align-items:center;justify-content:flex-end;padding-inline-end:4px;direction:rtl}
.scale{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);margin-top:10px;justify-content:flex-end}
.scale i{width:16px;height:10px;border-radius:3px;display:inline-block}

/* ---------- branches live ---------- */
.livegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.lb{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.lb .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.st{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;margin-inline-start:auto;white-space:nowrap}
.st.open{background:var(--goodbg);color:var(--good)}.st.closed{background:var(--surface);color:var(--ink3);border:1px solid var(--line)}
.lb .v{font-size:20px;font-weight:700;margin-top:8px}
.lb .m{font-size:12px;color:var(--ink3);margin-top:2px}

/* ---------- products ---------- */
.ptools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ptools input{flex:1;min-width:160px}
.plist{display:flex;flex-direction:column}
.pr{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.pr:last-child{border-bottom:0}
.pr .rk{width:30px;height:30px;border-radius:9px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--ink2)}
.pr.top3 .rk{background:var(--brandbg);color:var(--brand2)}
.pr .nm{font-weight:600;font-size:14.5px;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .ct{font-size:12px;color:var(--ink3);margin-top:2px}
.pr .bar{height:5px;border-radius:99px;background:var(--surface2);margin-top:7px;overflow:hidden}.pr .bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.pr .q{text-align:end}
.pr .q b{font-size:20px;font-weight:700;display:block;line-height:1.1}
.pr .q span{font-size:11.5px;color:var(--ink3)}
.pr .q small{display:block;font-size:12.5px;color:var(--ink2);font-weight:600;margin-top:2px}
.pbb{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:-4px}
.pbb span{font-size:12px;background:var(--surface2);border-radius:8px;padding:4px 8px;color:var(--ink2)}
.pbb b{color:var(--ink)}
.psum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.psum .card{flex:1;min-width:140px;padding:12px 14px}

/* ---------- days ---------- */
.day{margin-bottom:14px}
.dayh{display:flex;align-items:baseline;gap:10px;margin:4px 2px 8px}
.dayh b{font-size:15px}.dayh span{font-size:12.5px;color:var(--ink3)}
.sh{display:grid;grid-template-columns:1fr auto;gap:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px}
.sh .bn{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px}
.sh .tot{font-weight:700;font-size:17px;text-align:end}
.sh .meta{grid-column:1/-1;font-size:12px;color:var(--ink3)}
.sh .cash{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:6px}
.sh .cash div{background:var(--surface2);border-radius:10px;padding:8px 10px}
.sh .cash small{display:block;font-size:11px;color:var(--ink3)}
.sh .cash b{font-size:14px}
.badge{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.badge.ok{background:var(--goodbg);color:var(--good)}.badge.bad{background:var(--badbg);color:var(--bad)}.badge.warn{background:var(--warnbg);color:var(--warn)}

/* ---------- table view ---------- */
.tview{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.tview th,.tview td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:start}
.tview th{color:var(--ink3);font-weight:600}
.lnk{color:var(--brand2);font-size:12.5px;font-weight:600}

/* ---------- more ---------- */
.set{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .tx{flex:1}.set .tx b{display:block;font-size:14.5px}.set .tx span{font-size:12.5px;color:var(--ink3)}
.sw{width:48px;height:29px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);position:relative;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:21px;height:21px;border-radius:50%;background:var(--ink3);transition:.15s}
.sw.on{background:var(--brand);border-color:var(--brand)}.sw.on::after{inset-inline-start:22px;background:#fff}
.btn{padding:10px 16px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:600;font-size:14px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.note{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;margin-top:10px}
.empty{text-align:center;color:var(--ink3);padding:30px 10px;font-size:14px}
.skel{background:linear-gradient(90deg,var(--surface) 0%,var(--surface2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r);min-height:120px}
@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ---------- bottom tabs (phone) ---------- */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:var(--ink3);font-size:11px;font-weight:600}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--brand)}

/* ---------- desktop ---------- */
@media (min-width:960px){
  .side{display:flex;flex-direction:column;gap:4px;width:236px;flex-shrink:0;position:sticky;top:0;height:100vh;padding:20px 14px;border-inline-end:1px solid var(--line);background:var(--surface)}
  .side .brandmark{justify-content:flex-start;margin:4px 8px 22px}.side .brandmark .rq{font-size:34px}
  .side button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--ink2);font-weight:600;font-size:14.5px;text-align:start}
  .side button svg{width:20px;height:20px}
  .side button.on{background:var(--brandbg);color:var(--brand2)}
  .side .sp{flex:1}
  .side .who{font-size:12px;color:var(--ink3);padding:8px 12px}
  .tabs,.trow .mlogo{display:none}
  .main{padding-bottom:30px}
  .content{padding:22px 26px}
  .topin{padding:16px 26px 12px}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
  .g2b{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero .big{font-size:46px}
}
@media (min-width:600px) and (max-width:959px){ .kpis{grid-template-columns:repeat(4,minmax(0,1fr))} .g2b{grid-template-columns:repeat(2,minmax(0,1fr))} }
</style>
</head>
<body>

<div id="login" hidden>
  <div style="position:absolute;top:calc(14px + env(safe-area-inset-top));inset-inline-end:14px"><button class="ibtn themeBtn" aria-label="الوضع">☀️</button></div>
  <div class="lbox">
    <div class="brandmark"><span class="rq">RQ</span><span class="k">KITCHEN</span></div>
    <h1>لوحة المالك</h1>
    <p>أدخل رقمك السري ثم اضغط ✓</p>
    <div class="dots" id="dots"></div>
    <div class="lerr" id="lerr"></div>
    <div class="pad" id="pad"></div>
  </div>
</div>

<div class="shell" id="app" hidden>
  <aside class="side" id="side"></aside>
  <div class="main">
    <div class="top">
      <div class="topin">
        <div class="trow">
          <div class="mlogo"><span class="rq">RQ</span></div>
          <h2 id="title">الرئيسية</h2>
          <span class="live" id="liveTag" hidden><i></i><span>مباشر</span></span>
          <select id="brSel" style="width:auto;max-width:170px;padding:8px 10px;font-size:13.5px"></select>
          <button class="ibtn" id="refresh" aria-label="تحديث"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
        </div>
        <div class="seg" id="per"></div>
        <div class="crange" id="crange" hidden><input type="date" id="d1"><span class="muted">←</span><input type="date" id="d2"></div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<nav class="tabs" id="tabs" hidden></nav>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const SB="https://dhqgorvtwgzekmmjztyr.supabase.co", KEY="sb_publishable_yAYV8YXgiq3DxyJZPqELXw_QbzvL5Fe";
const NOTIFY=SB+"/functions/v1/owner-notify";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const fmt=(n,d=0)=>(+n||0).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const money=n=>{const v=+n||0;return fmt(v,Math.abs(v)>=1000||Number.isInteger(v)?0:2)};
const money2=n=>fmt(n,2);
const pad2=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const addD=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return ymd(d)};
const bizToday=()=>ymd(new Date(Date.now()-5*3600e3));
const AR_DAYS=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const AR_MON=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const dLabel=s=>{const d=new Date(s+"T12:00:00");return AR_DAYS[d.getDay()]+" "+d.getDate()+" "+AR_MON[d.getMonth()]};
const dShort=s=>{const d=new Date(s+"T12:00:00");return d.getDate()+" "+AR_MON[d.getMonth()]};
const hhmm=ts=>{if(!ts)return"";const d=new Date(ts);let h=d.getHours(),m=d.getMinutes();const p=h<12?"ص":"م";h=h%12||12;return h+":"+pad2(m)+" "+p};
const hLabel=h=>{const p=h<12?"ص":"م";return (h%12||12)+p};

async function rpc(fn,args){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),20000);
  try{const r=await fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(args),signal:ctl.signal});
    const tx=await r.text();if(!r.ok){let m=tx;try{m=JSON.parse(tx).message||m}catch(e){}const e=new Error(m);e.server=true;throw e}
    return tx?JSON.parse(tx):null}finally{clearTimeout(t)}
}

function delta(cur,prev,label){
  if(!prev&&!cur)return"";
  if(!prev)return `<span class="delta">${label}: لا توجد مبيعات</span>`;
  const p=(cur-prev)/prev*100,up=p>=0;
  return `<span class="delta ${up?"up":"down"}"><b class="num">${up?"▲":"▼"} ${fmt(Math.abs(p),Math.abs(p)<10?1:0)}%</b> ${label}</span>`;
}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function mix(a,b,t){const h=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));const A=h(a),B=h(b);return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join("")}

/* vertical bar chart (one series) with hover / tap tooltip */
function barChart(el,rows,opt){
  const W=el.clientWidth||600,H=opt.h||200,pl=46,pr=8,pt=12,pb=26;
  const max=Math.max(1,...rows.map(r=>r.v));const nice=niceMax(max);const n=rows.length;
  const iw=W-pl-pr,ih=H-pt-pb,slot=iw/n,bw=Math.max(3,Math.min(34,slot*0.66));
  const brand=css("--brand"),grid=css("--grid");
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.title||"")}">`;
  for(let i=0;i<=3;i++){const y=pt+ih-ih*i/3;s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="${grid}" stroke-width="1"/><text class="ax" x="${pl-8}" y="${y+4}" text-anchor="end">${fmtAx(nice*i/3)}</text>`}
  const every=Math.ceil(n/(W<500?6:12));
  rows.forEach((r,i)=>{const x=pl+slot*i+(slot-bw)/2,h=r.v>0?Math.max(2,ih*r.v/nice):0,y=pt+ih-h;const rad=Math.min(4,bw/2,h);
    if(h>0)s+=`<path d="M${x},${pt+ih} V${y+rad} Q${x},${y} ${x+rad},${y} H${x+bw-rad} Q${x+bw},${y} ${x+bw},${y+rad} V${pt+ih} Z" fill="${brand}"/>`;
    if(i%every===0||i===n-1&&n<=14)s+=`<text class="ax" x="${pl+slot*i+slot/2}" y="${H-7}" text-anchor="middle">${esc(r.l)}</text>`;
  });
  s+=`<line id="hl" x1="0" x2="0" y1="${pt}" y2="${pt+ih}" stroke="${css("--ink3")}" stroke-dasharray="3 3" opacity="0"/></svg><div class="tip"></div>`;
  el.innerHTML=s;const svg=el.querySelector("svg"),tip=el.querySelector(".tip"),hl=svg.querySelector("#hl");
  const mv=ev=>{const rc=svg.getBoundingClientRect();const x=(ev.clientX-rc.left)*W/rc.width;let i=Math.floor((x-pl)/slot);if(i<0||i>=n){out();return}
    const r=rows[i];const cx=pl+slot*i+slot/2;hl.setAttribute("x1",cx);hl.setAttribute("x2",cx);hl.setAttribute("opacity",".6");
    tip.innerHTML=opt.tip(r);tip.style.left=(cx*rc.width/W)+"px";const h=r.v>0?ih*r.v/nice:0;tip.style.top=((pt+ih-h)*rc.height/H)+"px";tip.classList.add("on")};
  const out=()=>{tip.classList.remove("on");hl.setAttribute("opacity","0")};
  svg.addEventListener("pointermove",mv);svg.addEventListener("pointerdown",mv);svg.addEventListener("pointerleave",out);
}
function niceMax(v){const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;const m=f<=1?1:f<=1.5?1.5:f<=2?2:f<=3?3:f<=5?5:f<=7.5?7.5:10;return m*e}
function fmtAx(v){return v>=1000?fmt(v/1000,v%1000?1:0)+"k":fmt(v)}

      <div class="chart" id="hours"></div>

    ${DATA.range.days>1?`<div class="card"><div class="chead"><div><h3>المبيعات اليومية</h3><div class="sub">${bestDay.sales?`أفضل يوم: <b style="color:var(--ink)">${dLabel(bestDay.d)}</b> — ${money(bestDay.sales)} د.إ`:""}</div></div></div><div class="chart" id="days"></div></div>`:""}

function dayHTML(){
  const sh=DATA.shifts||[];const ops=DATA.ops||{};
  const by={};sh.forEach(s=>{const d=ymd(new Date(new Date(s.opened_at).getTime()-5*3600e3));(by[d]=by[d]||[]).push(s)});
  const days=Object.keys(by).sort().reverse();
  const tdiff=sh.filter(s=>s.status==="closed").reduce((a,s)=>a+(+s.diff||0),0);
  const tdep=sh.reduce((a,s)=>a+(+s.deposit||0),0);
  return plabel()+`
  <div class="kpis" style="margin-bottom:12px">
    <div class="card kpi"><div class="l">💵 مبيعات الكاش</div><div class="v num">${money(DATA.kpi.cash)}<small>د.إ</small></div></div>
    <div class="card kpi"><div class="l">🏦 المسلّم للمدير</div><div class="v num">${money(tdep+(+ops.drop||0))}<small>د.إ</small></div></div>
    <div class="card kpi"><div class="l">🧾 مصروفات من الدرج</div><div class="v num">${money(ops.out||0)}<small>د.إ</small></div><div class="s">${+ops.in?`إيداع ${money(ops.in)}`:"&nbsp;"}</div></div>
    <div class="card kpi"><div class="l">⚖️ نقص / زيادة</div><div class="v num" style="color:${Math.abs(tdiff)<.01?"var(--good)":tdiff<0?"var(--bad)":"var(--warn)"}">${Math.abs(tdiff)<.01?"0":(tdiff<0?"−":"+")+money(Math.abs(tdiff))}</div><div class="s">${Math.abs(tdiff)<.01?"✅ كل الأدراج مطابقة":tdiff<0?"⚠️ نقص في الأدراج":"زيادة في الأدراج"}</div></div>
  </div>
  ${days.length?days.map(d=>`<div class="day"><div class="dayh"><b>${dLabel(d)}</b><span>${by[d].length} ${by[d].length>1?"فروع":"فرع"}</span></div>
    ${by[d].map(s=>{const open=s.status==="open";const tot=(+s.cash_sales||0)+(+s.card||0)+(+s.apps||0);const df=+s.diff||0;
      const badge=open?`<span class="badge warn">● مفتوح</span>`:Math.abs(df)<.01?`<span class="badge ok">✅ مطابق</span>`:df<0?`<span class="badge bad">⚠️ نقص ${money(-df)}</span>`:`<span class="badge warn">زيادة ${money(df)}</span>`;
      return `<div class="sh"><div class="bn">${esc(bName(s.branch))} ${badge}</div><div class="tot num">${open?"—":money(tot)+" <small class=muted style=font-size:12px>د.إ</small>"}</div>
        <div class="meta">فتح ${hhmm(s.opened_at)}${s.opened_by?" ("+esc(s.opened_by)+")":""}${open?"":` · قفل ${hhmm(s.closed_at)}${s.closed_by?" ("+esc(s.closed_by)+")":""} · ${fmt(s.orders||0)} طلب`}</div>
        <div class="cash"><div><small>فتح الدرج</small><b class="num">${money(s.opening)}</b></div><div><small>مبيعات الكاش</small><b class="num">${open?"—":money(s.cash_sales)}</b></div><div><small>المعدود</small><b class="num">${open?"—":money(s.counted)}</b></div><div><small>للمدير</small><b class="num">${open?"—":money(s.deposit||0)}</b></div></div></div>`}).join("")}</div>`).join(""):`<div class="card empty">لا توجد أيام مفتوحة أو مقفلة في هذه الفترة</div>`}`;
}

  const pushOK=NATIVE?!!NPUSH:("serviceWorker" in navigator&&"PushManager" in window);
  const standalone=NATIVE||window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const on=LS.get("own.push",false);
  return `<div class="grid" style="max-width:640px">
    <div class="card">
      <div class="set"><div class="tx"><b>🔔 ملخص إغلاق كل فرع</b><span>إشعار على جوالك أول ما يقفل أي فرع يومه: المبيعات، الطلبات، والكاش (مطابق / نقص)</span></div><button class="sw ${on?"on":""}" id="pushSw" ${pushOK?"":"disabled"}></button></div>
      ${!pushOK||(ios&&!standalone)?`<div class="note">${ios?"على الآيفون: اضغط زر المشاركة <b>⬆︎</b> ثم <b>«إضافة إلى الشاشة الرئيسية»</b>، وافتح التطبيق من الأيقونة — بعدها تقدر تفعّل الإشعارات.":"المتصفح هذا ما يدعم الإشعارات — افتح الرابط من Chrome أو Safari."}</div>`:""}
      <div class="set"><div class="tx"><b>🌓 المظهر</b><span>${theme==="light"?"فاتح":"داكن"}</span></div><button class="btn themeBtn">${theme==="light"?"🌙":"☀️"}</button></div>
      ${!standalone?`<div class="set"><div class="tx"><b>📲 ثبّت التطبيق</b><span>${ios?"Safari: زر المشاركة ⬆︎ ← إضافة إلى الشاشة الرئيسية":"Chrome: القائمة ⋮ ← تثبيت التطبيق / إضافة إلى الشاشة الرئيسية"}</span></div></div>`:""}
      <div class="set"><div class="tx"><b>🔄 آخر تحديث</b><span class="num">${lastLoad?new Date(lastLoad).toLocaleTimeString("ar-AE-u-nu-latn",{hour:"numeric",minute:"2-digit"}):"—"} · يتحدّث تلقائيًا كل دقيقة</span></div></div>
      <div class="set"><div class="tx"><b>🚪 تسجيل الخروج</b><span>من هذا الجهاز فقط</span></div><button class="btn" id="logout">خروج</button></div>
    </div>
    <div class="muted" style="font-size:12px;text-align:center">لوحة المالك للمشاهدة فقط — الأسعار والأصناف والفروع تتعدّل من لوحة التحكم</div>
  </div>`;
}

function afterRender(){
  if(tab==="home"&&$("#trend")){const r=DATA.range;
    if(r.days===1){const rows=trimHours(DATA.by_hour).map(h=>({l:hLabel(h.h),v:+h.sales,o:h.orders,h:h.h}));
      barChart($("#trend"),rows.map(x=>Object.assign(x,{hi:true})),{h:210,title:"المبيعات حسب الساعة",tip:x=>`<b>${hLabel(x.h)} – ${hLabel((x.h+1)%24)}</b><br>${money(x.v)} د.إ · ${fmt(x.o)} طلب`})}
    else{const rows=(DATA.by_day||[]).map(d=>({l:dShort(d.d).split(" ")[0],v:+d.sales,o:d.orders,d:d.d,hi:true}));
      barChart($("#trend"),rows,{h:210,title:"المبيعات اليومية",tip:x=>`<b>${dLabel(x.d)}</b><br>${money(x.v)} د.إ · ${fmt(x.o)} طلب`})}}
  if(tab==="insights"){
    if($("#hours")){const rows=trimHours(DATA.by_hour).map(h=>({l:hLabel(h.h),v:+h.sales,o:h.orders,h:h.h,hi:true}));
      barChart($("#hours"),rows,{h:220,title:"ساعات الذروة",tip:x=>`<b>${hLabel(x.h)} – ${hLabel((x.h+1)%24)}</b><br>${money(x.v)} د.إ · ${fmt(x.o)} طلب`})}
    if($("#days")){const rows=(DATA.by_day||[]).map(d=>({l:dShort(d.d).split(" ")[0],v:+d.sales,o:d.orders,d:d.d,hi:true}));
      barChart($("#days"),rows,{h:220,title:"المبيعات اليومية",tip:x=>`<b>${dLabel(x.d)}</b><br>${money(x.v)} د.إ · ${fmt(x.o)} طلب`})}
    if($("#heat"))drawHeat($("#heat"));
  }
  if(tab==="products"){
    const q=$("#pq");if(q){q.oninput=e=>{pQ=e.target.value;const pos=e.target.selectionStart;render();const n=$("#pq");n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}
    const so=$("#psort");if(so)so.onchange=e=>{pSort=e.target.value;render()};
    document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{pCat=b.dataset.cat;render()});
  }
  if(tab==="more"){
    const sw=$("#pushSw");if(sw)sw.onclick=()=>togglePush(!sw.classList.contains("on"));
    const lo=$("#logout");if(lo)lo.onclick=async()=>{try{await rpc("owner_logout",{p_token:token})}catch(e){}LS.del("own.token");LS.del("own.cache");LS.set("own.push",false);token=null;DATA=null;showLogin()};
  }
}
/* the hours the branches actually work: drop empty hours at both ends of the business day (05:00 → 04:59) */
function trimHours(hs){const order=[...Array(24)].map((_,i)=>(i+5)%24);const m=Object.fromEntries((hs||[]).map(h=>[h.h,h]));
  const seq=order.map(h=>m[h]||{h,sales:0,orders:0});let a=seq.findIndex(x=>x.orders>0),b=seq.length-1-[...seq].reverse().findIndex(x=>x.orders>0);
  if(a<0)return seq.slice(10,22);a=Math.max(0,a-1);b=Math.min(seq.length-1,b+1);return seq.slice(a,b+1)}
function drawHeat(el){
  const cells=DATA.heat||[];const hrs=trimHours(DATA.by_hour).map(h=>h.h);const W=[7,1,2,3,4,5,6];/* isodow: Sun=7 */
  const lab={7:"الأحد",1:"الإثنين",2:"الثلاثاء",3:"الأربعاء",4:"الخميس",5:"الجمعة",6:"السبت"};
  const m={};cells.forEach(c=>m[c.w+"-"+c.h]=c);const max=Math.max(1,...cells.map(c=>+c.sales));
  const surf=css("--surface2"),brand=css("--brand");
  let s=`<div class="chart"><div class="heat" style="grid-template-columns:52px repeat(${hrs.length},minmax(0,1fr))"><div></div>${hrs.map((h,i)=>`<div class="hl">${i%2===0?hLabel(h):""}</div>`).join("")}`;
  W.forEach(w=>{s+=`<div class="wl">${lab[w]}</div>`;hrs.forEach(h=>{const c=m[w+"-"+h];const t=c?+c.sales/max:0;
    s+=`<div class="c" data-t="${esc(lab[w]+" "+hLabel(h))}" data-v="${c?c.sales:0}" data-o="${c?c.orders:0}" style="background:${c?mix(surf.startsWith("#")?surf:"#1c1c20",brand,.15+.85*t):surf}"></div>`})});
  s+=`</div><div class="tip"></div></div><div class="scale">أقل<i style="background:${mix(surf,brand,.15)}"></i><i style="background:${mix(surf,brand,.5)}"></i><i style="background:${brand}"></i>أكثر</div>`;
  el.innerHTML=s;const wrap=el.querySelector(".chart"),tip=wrap.querySelector(".tip");
  const show=e=>{const c=e.target.closest(".c");if(!c){tip.classList.remove("on");return}const rc=wrap.getBoundingClientRect(),cr=c.getBoundingClientRect();
    tip.innerHTML=`<b>${c.dataset.t}</b><br>${money(c.dataset.v)} د.إ · ${fmt(c.dataset.o)} طلب`;tip.style.left=(cr.left-rc.left+cr.width/2)+"px";tip.style.top=(cr.top-rc.top)+"px";tip.classList.add("on")};
  wrap.addEventListener("pointermove",show);wrap.addEventListener("pointerdown",show);wrap.addEventListener("pointerleave",()=>tip.classList.remove("on"));
}
let rT;window.addEventListener("resize",()=>{clearTimeout(rT);rT=setTimeout(()=>{if(DATA&&(tab==="home"||tab==="insights"))afterRender()},150)});

/* ---------- push ---------- */
let swReg=null;
const CAP=window.Capacitor, NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
const NPUSH=NATIVE&&CAP.Plugins&&CAP.Plugins.PushNotifications;
if(NATIVE)document.documentElement.classList.add("native");
async function nativePush(on){
  if(!NPUSH){toast("الإشعارات غير متاحة");return}
  if(!on){const t=LS.get("own.apns","");if(t){try{await rpc("owner_push_native",{p_token:token,p_apns:t,p_on:false})}catch(e){}}LS.set("own.push",false);toast("تم إيقاف الإشعارات");render();return}
  let p=await NPUSH.checkPermissions();if(p.receive!=="granted")p=await NPUSH.requestPermissions();
  if(p.receive!=="granted"){toast("فعّل الإشعارات للتطبيق من إعدادات الآيفون");return}
  await NPUSH.removeAllListeners();
  NPUSH.addListener("registration",async t=>{try{LS.set("own.apns",t.value);await rpc("owner_push_native",{p_token:token,p_apns:t.value,p_on:true});LS.set("own.push",true);toast("✅ بيوصلك ملخص كل فرع عند إغلاق يومه");render()}catch(e){toast("تعذّر تفعيل الإشعارات")}});
  NPUSH.addListener("registrationError",()=>toast("تعذّر تفعيل الإشعارات"));
  NPUSH.addListener("pushNotificationActionPerformed",()=>{setTab("day")});
  await NPUSH.register();
}
async function regSW(){if(NATIVE)return;if(!("serviceWorker" in navigator))return;if(location.hostname.startsWith("cashier.")||location.hostname.startsWith("console."))return;try{swReg=await navigator.serviceWorker.register("/owner-sw.js")}catch(e){}}
function b64u(s){const p="=".repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function togglePush(on){
  if(NATIVE)return nativePush(on);
  try{
    if(!swReg)await regSW();if(!swReg)throw new Error("sw");
    if(on){const perm=await Notification.requestPermission();if(perm!=="granted"){toast("ما تم السماح بالإشعارات من إعدادات الجهاز");return}
      const k=await (await fetch(NOTIFY)).json();
      let sub=await swReg.pushManager.getSubscription();if(!sub)sub=await swReg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(k.vapid)});
      await rpc("owner_push_sub",{p_token:token,p_sub:sub.toJSON(),p_on:true});LS.set("own.push",true);toast("✅ بيوصلك ملخص كل فرع عند إغلاق يومه");
    }else{const sub=await swReg.pushManager.getSubscription();if(sub){try{await rpc("owner_push_sub",{p_token:token,p_sub:sub.toJSON(),p_on:false})}catch(e){}await sub.unsubscribe()}LS.set("own.push",false);toast("تم إيقاف الإشعارات")}
  }catch(e){toast("تعذّر تفعيل الإشعارات على هذا الجهاز")}
  render();
}

window.__own={get data(){return DATA},render,setTab};
if(token)start();else showLogin();
})();
</script>
