/* login */
.login{max-width:420px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top,0px)) 22px 30px}
.login .badge{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.login .badge img{width:84px;background:#fff;border-radius:16px;padding:6px 10px}
.login .badge b{display:block;font-size:22px;font-weight:800}
.login .badge span{color:var(--muted);font-size:14px}
.lbl{display:block;font-weight:700;font-size:14px;margin:0 0 7px}
.phone{display:flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;direction:ltr;background:var(--card)}
.phone:focus-within{border-color:var(--brand)}
.phone span{display:flex;align-items:center;padding:0 12px;background:var(--surface);font-family:var(--display);font-weight:800;color:var(--muted)}
.phone input{flex:1;border:0;outline:none;padding:13px;font-size:18px;background:transparent;font-family:var(--display);min-width:0}
.f{display:block;width:100%;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-size:22px;font-family:var(--display);letter-spacing:10px;text-align:center}
.f:focus{border-color:var(--brand);outline:none}
.fg{margin-bottom:14px}
.err{color:var(--danger);font-size:14px;margin-top:8px;min-height:20px}

.btn{appearance:none;border:0;border-radius:16px;padding:14px 18px;font-weight:800;font-size:16px;min-height:54px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.block{width:100%}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.ok{background:var(--ok);color:#fff}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.blue{background:var(--blue-bg);color:var(--blue)}
.btn.line{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border:2px solid currentColor}
.btn.sm{min-height:44px;padding:10px 12px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:20px;height:20px;flex:none}

/* header */
.hdr{background:#1C1612;color:#FFF4E6;padding:calc(14px + env(safe-area-inset-top,0px)) 0 18px;border-radius:0 0 26px 26px}
.hdr .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr b{display:block;font-size:19px;font-weight:800}
.hdr small{display:block;opacity:.75;font-size:13px}
.hdr .out{appearance:none;border:0;background:rgba(255,255,255,.1);color:inherit;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600}
.onl{margin-top:14px;display:flex;align-items:center;gap:12px;width:100%;appearance:none;border:0;border-radius:18px;padding:14px 16px;text-align:start;background:rgba(255,255,255,.08);color:#FFF4E6}
.onl .sw{width:58px;height:34px;border-radius:99px;background:#5A4C42;position:relative;flex:none;transition:background .2s}
.onl .sw::after{content:"";position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s}
.onl.on .sw{background:#2FB45F}
.onl.on .sw::after{transform:translateX(-24px)}
.onl b{font-size:16px}
.onl small{opacity:.8}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:rgba(255,255,255,.08);border-radius:14px;padding:10px 12px}
.stat span{display:block;font-size:12.5px;opacity:.75}
.stat b{font-family:var(--display);font-size:22px;direction:ltr;text-align:right}
.gps{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:10px;opacity:.85}
.gps i{width:8px;height:8px;border-radius:50%;background:#8C7F75}
.gps.ok i{background:#2FB45F;box-shadow:0 0 0 4px rgba(47,180,95,.25)}
.gps.bad i{background:#F05A4A}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border-radius:16px;padding:5px;margin:16px 0 12px}
.tabs button{appearance:none;border:0;background:transparent;border-radius:12px;padding:11px;font-weight:800;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(28,20,16,.08)}
.tabs .n{background:var(--brand);color:var(--brand-ink);font-family:var(--display);min-width:22px;height:22px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;padding:0 6px}

.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(28,20,16,.06)}
.card.new{box-shadow:0 0 0 3px var(--brand)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ch .no{font-family:var(--display);font-weight:800;font-size:20px;direction:ltr}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:99px;padding:4px 10px;white-space:nowrap}
.pill.wait{background:var(--disc);color:var(--brand-text)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.blue{background:var(--blue-bg);color:var(--blue)}
.route{margin:14px 0 12px;display:grid;grid-template-columns:22px 1fr;column-gap:12px;row-gap:4px}
.route .d{width:14px;height:14px;border-radius:50%;margin-top:5px;justify-self:center}
.route .d.a{background:var(--ink)}
.route .d.b{background:var(--brand);box-shadow:0 0 0 4px var(--disc)}
.route .ln{width:2px;height:22px;background:var(--line);justify-self:center}
.route b{display:block;font-size:15px}
.route small{display:block;color:var(--muted);font-size:13px}
.money{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.money b{font-family:var(--display);font-size:22px;direction:ltr;white-space:nowrap}
.money span{padding-inline-end:10px}
.money span{font-size:13.5px;font-weight:700}
.money.cash span{color:var(--ok)}
.money.card span{color:var(--blue)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px;margin-bottom:12px}
.items{margin:0 0 12px;padding:10px 12px;background:var(--surface);border-radius:14px;font-size:14px;list-style:none}
.items li{display:flex;gap:8px;direction:ltr;justify-content:flex-end;text-align:right}
.items li b{font-family:var(--display)}
.note{background:var(--disc);color:var(--brand-text);border-radius:12px;padding:8px 12px;font-size:13.5px;margin-bottom:12px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 14px}
.steps span{height:6px;border-radius:9px;background:var(--line)}
.steps span.on{background:var(--brand)}
.stepl{font-size:13px;color:var(--muted);margin:-6px 0 12px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.acts.three{grid-template-columns:1fr 1fr 1fr}.acts.three .btn{padding-inline:6px;gap:5px;font-size:13px;white-space:nowrap}.acts.three .btn svg{width:16px;height:16px;flex:none}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty svg{width:60px;height:60px;color:var(--brand);margin:0 auto 10px;display:block}
.empty h3{margin:0 0 6px;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 40px)}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(20,16,14,.55)}
.modal.open{display:flex}
.modal .p{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.modal h2{margin:0 0 6px;font-size:20px}
.modal p{margin:0 0 16px;color:var(--muted)}
.modal .big{font-family:var(--display);font-size:34px;font-weight:800;direction:ltr;text-align:center;margin:6px 0 16px}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin:14px 0 30px}

/* no zoom on double-tap or input focus (iOS) */
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}input,select,textarea{font-size:max(16px,1em)!important}
</style>

<body>

<section id="loginV" class="login" hidden>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mT"><div class="p"><h2 id="mT"></h2><p id="mP"></p><div id="mB"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button type="button" class="btn ghost" id="mNo">رجوع</button><button type="button" class="btn ok" id="mYes">تأكيد</button></div></div></div>

/* ---------- geo helpers ---------- */
function km(a,b,c,d){if([a,b,c,d].some(function(x){return x==null;}))return null;var R=6371,r=Math.PI/180,x=Math.sin((c-a)*r/2),y=Math.sin((d-b)*r/2);var h=x*x+Math.cos(a*r)*Math.cos(c*r)*y*y;return 2*R*Math.asin(Math.sqrt(h));}
function fkm(k){return k==null?'':(k<1?Math.round(k*1000)+' م':k.toFixed(1)+' كم');}
function navUrl(lat,lng,q){return lat!=null&&lng!=null?'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+lat+','+lng:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q||'');}

  if(!list.length){L.innerHTML=tab==='mine'?
      '<div class="empty">'+I.box+'<h3>ما عندك طلبات الحين</h3><p>'+(on?'افتح "طلبات جديدة" واقبل طلب.':'شغّل "متصل" عشان تشوف الطلبات الجديدة.')+'</p></div>':
      '<div class="empty">'+(on?I.box:I.moon)+'<h3>'+(on?'ما فيه طلبات جديدة':'أنت غير متصل')+'</h3><p>'+(on?'أول ما يجهز طلب توصيل بيطلع هنا وبتسمع تنبيه.':'شغّل "متصل" فوق.')+'</p></div>';return;}
  L.innerHTML=list.map(tab==='mine'?mineCard:availCard).join('');
}
function routeHTML(o){var b=o.branch||{},a=o.address||{};var me=lastPos;var k1=me?km(me.lat,me.lng,b.lat,b.lng):null,k2=km(b.lat,b.lng,a.lat,a.lng);
  return '<div class="route"><span class="d a"></span><div><b>فرع '+esc(b.name_ar)+'</b><small>'+(k1!=null?'يبعد عنك '+fkm(k1):esc(b.address||''))+'</small></div><span class="ln"></span><span></span>'+
    '<span class="d b"></span><div><b>'+esc(o.name)+' · '+esc(a.area||'')+'</b><small>'+(a.details?esc(a.details):'')+(k2!=null?(a.details?' · ':'')+fkm(k2)+' من الفرع':'')+(a.lat==null?' · بدون موقع على الخريطة':'')+'</small></div></div>';}
function moneyHTML(o){return o.payment==='cash'?'<div class="money cash"><span>حصّل من العميل كاش</span><b>'+money(o.total)+' AED</b></div>':'<div class="money card"><span>الدفع بالبطاقة عند الاستلام · خذ جهاز الدفع</span><b>'+money(o.total)+' AED</b></div>';}
function itemsHTML(o){return '<ul class="items">'+o.items.map(function(i){return '<li><span>'+esc(i.name)+'</span><b>'+i.qty+'×</b></li>';}).join('')+'</ul>';}
var SL={accepted:'الفرع قبل الطلب',preparing:'الفرع يجهّزه',ready:'جاهز للاستلام',on_way:'معك في الطريق'};
function availCard(o){var fresh=!!hl[o.id];
  return '<article class="card'+(fresh?' new':'')+'"><div class="ch"><span class="no">#'+o.order_no+'</span><span class="pill '+(o.status==='ready'?'ok':'wait')+'">'+SL[o.status]+'</span></div>'+routeHTML(o)+moneyHTML(o)+
    '<div class="meta"><span>'+o.items.reduce(function(a,i){return a+i.qty;},0)+' أصناف</span><span>'+ago(o.created_at)+'</span></div>'+
    '<button type="button" class="btn pri block" data-act="accept" data-id="'+esc(o.id)+'">اقبل الطلب</button></article>';}
function mineCard(o){var b=o.branch||{},a=o.address||{},onway=o.status==='on_way',tel='+'+String(o.phone||'').replace(/\D/g,'');
  var h='<article class="card"><div class="ch"><span class="no">#'+o.order_no+'</span><span class="pill '+(onway?'blue':o.status==='ready'?'ok':'wait')+'">'+SL[o.status]+'</span></div>'+
    '<div class="steps" aria-hidden="true"><span class="on"></span><span class="'+(onway?'on':'')+'"></span><span></span></div>'+
    '<p class="stepl">'+(onway?'الخطوة 2 من 3: وصّل الطلب للعميل':'الخطوة 1 من 3: روح للفرع واستلم الطلب')+'</p>'+routeHTML(o)+moneyHTML(o)+itemsHTML(o)+(o.notes?'<div class="note">ملاحظة العميل: '+esc(o.notes)+'</div>':'');
  if(!onway){
    h+='<div class="acts"><a class="btn blue sm" target="_blank" rel="noopener" href="'+esc(navUrl(b.lat,b.lng,b.address))+'">'+I.nav+' موقع الفرع</a><a class="btn ghost sm" target="_blank" rel="noopener" href="'+esc(navUrl(a.lat,a.lng,(a.area||'')+' '+(a.details||'')))+'">'+I.nav+' موقع العميل</a></div>'+
      '<a class="btn ghost sm block" style="margin-bottom:10px" target="_blank" rel="noopener" href="https://wa.me/'+esc(String(b.whatsapp||'').replace(/\D/g,''))+'">'+I.wa+' واتساب الفرع</a>'+
      '<button type="button" class="btn dark block" data-act="pickup" data-id="'+esc(o.id)+'">استلمت الطلب من الفرع</button>'+
      '<button type="button" class="btn line block sm" style="margin-top:8px" data-act="release" data-id="'+esc(o.id)+'">ترك الطلب</button>';
  }else{
    h+='<div class="acts three"><a class="btn blue sm" target="_blank" rel="noopener" href="'+esc(navUrl(a.lat,a.lng,(a.area||'')+' '+(a.details||'')))+'">'+I.nav+' جوجل</a>'+
      (a.lat!=null?'<a class="btn blue sm" target="_blank" rel="noopener" href="'+esc(wazeUrl(a.lat,a.lng))+'">'+I.nav+' ويز</a>':'<span></span>')+
      '<a class="btn ghost sm" href="tel:'+esc(tel)+'">'+I.phone+' اتصال</a></div>'+
      '<a class="btn ghost sm block" style="margin-bottom:10px" target="_blank" rel="noopener" href="https://wa.me/'+esc(tel.replace('+',''))+'?text='+encodeURIComponent('هلا، معك سائق RQ Kitchen بخصوص طلبك #'+o.order_no)+'">'+I.wa+' واتساب العميل</a>'+
      '<button type="button" class="btn ok block" data-act="deliver" data-id="'+esc(o.id)+'">تم التوصيل</button>';
  }
  return h+'</article>';}

document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){tab=b.dataset.tab;if(tab==='avail')setTimeout(function(){hl={};render();},4000);render();};});
$('#list').addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var id=b.dataset.id,act=b.dataset.act,o=(DATA.mine.concat(DATA.available)).find(function(x){return x.id===id;});
  if(act==='accept')return doAct('app_driver_accept',id,b,'قبلت الطلب #'+o.order_no,function(){tab='mine';});
  if(act==='pickup')return confirmBox('استلمت الطلب؟','تأكد إن الأصناف كاملة. العميل بيشوف إنك في الطريق وموقعك على الخريطة.',itemsHTML(o),function(){doAct('app_driver_pickup',id,b,'بالتوفيق، العميل يشوفك الحين');});
  if(act==='deliver')return confirmBox('سلّمت الطلب؟',o.payment==='cash'?'تأكد إنك حصّلت المبلغ كاش:':'تأكد إن العميل دفع بالبطاقة:','<div class="big">'+money(o.total)+' AED</div>',function(){doAct('app_driver_deliver',id,b,'تم التوصيل، يعطيك العافية');});
  if(act==='release')return confirmBox('تترك الطلب؟','بيرجع الطلب لقائمة الطلبات الجديدة لسائق ثاني.','',function(){doAct('app_driver_release',id,b,'تركت الطلب');});
});
function doAct(fn,id,btn,ok,after){btn.disabled=true;rpc(fn,{t:T,order_id:id}).then(function(r){if(r&&r.ok){toast(ok);if(after)after();}else{if(r&&r.error==='auth')return logoutLocal();toast(emsg(r&&r.error));}return refresh();}).catch(function(){toast(ERR.net);btn.disabled=false;});}
function confirmBox(t,p,b,yes){$('#mT').textContent=t;$('#mP').textContent=p;$('#mB').innerHTML=b||'';var m=$('#modal');m.classList.add('open');$('#mYes').focus();$('#mYes').onclick=function(){m.classList.remove('open');yes();};$('#mNo').onclick=function(){m.classList.remove('open');};}
document.addEventListener('keydown',function(e){if(e.key==='Escape')$('#modal').classList.remove('open');});

/* ---------- online + GPS ---------- */
$('#onl').onclick=function(){var want=!(DATA&&DATA.driver.online);unlockSound();
  rpc('app_driver_set_online',{t:T,on_:want}).then(function(r){if(r&&r.ok){DATA.driver.online=want;if(want){startGps();tab='avail';toast('أنت متصل، بنرسل لك الطلبات');}else{stopGps();toast('أنت غير متصل');}render();refresh();}else toast(emsg(r&&r.error));}).catch(function(){toast(ERR.net);});};
function gpsState(c,t){var g=$('#gps');g.className='gps '+c;$('#gpsT').textContent=t;}
function startGps(){if(watchId!=null)return;keepAwake();if(window.RQBG)RQBG.start({url:SB,key:KEY,token:T});if(!navigator.geolocation){gpsState('bad','جوالك ما يدعم تحديد الموقع');return;}
  gpsState('','نحدد موقعك…');
  watchId=navigator.geolocation.watchPosition(function(p){var c={lat:p.coords.latitude,lng:p.coords.longitude};var moved=!lastPos||km(lastPos.lat,lastPos.lng,c.lat,c.lng)>0.03;lastPos=c;
      gpsState('ok','موقعك يوصل للعميل · دقة '+Math.round(p.coords.accuracy)+' م');
      if(!window.RQBG&&Date.now()-lastSent>(moved?8000:25000)){lastSent=Date.now();if(!DEMO)rpc('app_driver_location',{t:T,lat:c.lat,lng:c.lng}).catch(function(){});}},
    function(err){gpsState('bad',err.code===1?'اسمح للمتصفح بالوصول لموقعك من الإعدادات':'ما قدرنا نحدد موقعك');},
    {enableHighAccuracy:true,maximumAge:5000,timeout:20000});}
function stopGps(){if(window.RQBG)RQBG.stop();if(watchId!=null&&navigator.geolocation)navigator.geolocation.clearWatch(watchId);watchId=null;gpsState('','الموقع متوقف');if(wake){try{wake.release();}catch(e){}wake=null;}}
function keepAwake(){if('wakeLock' in navigator){navigator.wakeLock.request('screen').then(function(w){wake=w;}).catch(function(){});}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){if(DATA&&DATA.driver.online&&watchId!=null)keepAwake();refresh();}});

/* ---------- alert sound for new orders ---------- */
function unlockSound(){try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();}catch(e){}}
function ding(){try{if(!audio)return;[0,0.18,0.36].forEach(function(t,i){var o=audio.createOscillator(),g=audio.createGain();o.frequency.value=i===2?1175:880;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(0.0001,audio.currentTime+t);g.gain.exponentialRampToValueAtTime(0.35,audio.currentTime+t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,audio.currentTime+t+0.16);o.start(audio.currentTime+t);o.stop(audio.currentTime+t+0.18);});}catch(e){}if(navigator.vibrate)navigator.vibrate([200,100,200]);}

/* ---------- polling ---------- */
var busy=false;
function refresh(){if(!T||busy)return Promise.resolve();busy=true;
  return rpc('app_driver_orders',{t:T}).then(function(r){
    if(!r||!r.ok){if(r&&r.error==='auth')logoutLocal();return;}
    var fresh=(r.available||[]).filter(function(o){return !seenAvail[o.id];});
    if(DATA&&fresh.length&&r.driver.online){ding();toast(fresh.length===1?'طلب توصيل جديد #'+fresh[0].order_no:fresh.length+' طلبات توصيل جديدة');fresh.forEach(function(o){hl[o.id]=1;});}
    (r.available||[]).forEach(function(o){seenAvail[o.id]=1;});
    if(!DATA&&window.RQPush)RQPush.register(function(tk){if(T)rpc('app_driver_push_register',{t:T,token:tk}).then(function(){return rpc('app_push_lang',{token:tk,lang:window.RQLANG||'ar'});}).catch(function(){});});
    DATA=r;showApp();if(r.driver.online)startGps();else stopGps();render();
  }).catch(function(){}).finally(function(){busy=false;});}
function logoutLocal(){if(window.RQBG)RQBG.stop();var ptk=window.RQPush&&RQPush.token();if(ptk)rpc('app_push_unregister',{token:ptk}).catch(function(){});T=null;store.del('rqd-token');DATA=null;showLogin();toast(ERR.auth);}
setInterval(function(){if(document.visibilityState==='visible')refresh();},8000);
setInterval(function(){if(DATA)render();},60000);

/* ---------- boot ---------- */
function boot(){if(T){refresh().then(function(){if(!DATA)showLogin();});}else showLogin();}
if(preview){fetch(SB+'/rest/v1/',{headers:H}).then(function(r){if(!r.ok&&r.status!==404&&r.status!==401)throw 0;boot();}).catch(function(){DEMO=true;demoInit();$('#demo').hidden=false;boot();});}
else boot();
})();
</script>
