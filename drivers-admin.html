<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>إدارة السواقين — RQ Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Alexandria:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--surface:#F7F3EF;--line:#E6DCD2;--ink:#1C1410;--muted:#5E5048;--brand:#F29835;--brand-ink:#14100D;--brand-text:#A84F07;--disc:#FDE7CB;--ok:#17803F;--ok-bg:#E2F3E8;--danger:#B42318;--danger-bg:#FDECEA;
  --display:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;--ar:'Alexandria','Geeza Pro','Segoe UI',Tahoma,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141110;--surface:#1E1916;--line:#33291F;--ink:#FFF4E6;--muted:#C9BBAE;--brand-text:#F7B060;--disc:#3A2A1A;--ok-bg:#133222;--danger-bg:#3A1714}}
:root[data-theme="dark"]{--bg:#141110;--surface:#1E1916;--line:#33291F;--ink:#FFF4E6;--muted:#C9BBAE;--brand-text:#F7B060;--disc:#3A2A1A;--ok-bg:#133222;--danger-bg:#3A1714}
*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ar);font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
[hidden]{display:none !important}
.wrap{max-width:760px;margin:0 auto;padding-left:16px;padding-right:16px}
header.top{display:flex;align-items:center;gap:12px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:12px;border-bottom:1px solid var(--line)}
header.top img{width:64px}
header.top h1{font-size:19px;margin:0;flex:1}
.btn{appearance:none;border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border:2px solid currentColor}
.btn:disabled{opacity:.6}
.f{display:block;width:100%;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px}
.f:focus{border-color:var(--brand);outline:none}
.lbl{display:block;font-weight:700;font-size:14px;margin:0 0 6px}
.login{max-width:380px;margin:60px auto;text-align:center}
.login img{width:110px;margin:0 auto 10px;display:block}
.err{color:var(--danger);font-size:14px;margin-top:8px;min-height:20px}
.hint{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.card.off{opacity:.55}
.card b{font-size:16px}
.card .ph{font-family:var(--display);direction:ltr;display:inline-block;color:var(--muted);font-size:14px}
.card .meta{font-size:13px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.on{background:var(--ok-bg);color:var(--ok)}.pill.off{background:var(--danger-bg);color:var(--danger)}.pill.idle{background:var(--line);color:var(--muted)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 12px}
.bar h2{margin:0;font-size:18px}
.share{background:var(--disc);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:14px}
.share code{font-family:var(--display);direction:ltr;display:inline-block}
.modal{position:fixed;inset:0;z-index:50;display:none}
.modal.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(20,16,14,.5)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:94%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.panel h2{margin:0 0 12px;font-size:20px}
.field{margin-bottom:12px}
.switch{display:flex;align-items:center;gap:10px;margin:6px 0 12px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--brand)}
.phone{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;direction:ltr}
.phone:focus-within{border-color:var(--brand)}
.phone span{display:flex;align-items:center;padding:0 10px;background:var(--surface);font-family:var(--display);color:var(--muted)}
.phone input{flex:1;border:0;outline:none;padding:10px;font-size:16px;background:var(--bg);font-family:var(--display);min-width:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 40px)}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="loginView" class="wrap login">
  <img src="logo.png" alt="RQ Kitchen">
  <h1 style="font-size:22px;margin:0 0 6px">إدارة السواقين</h1>
  <p class="hint">نفس الرقم السري حق لوحة تحكم المنيو</p>
  <form id="loginForm"><input class="f" id="pin" type="password" inputmode="numeric" autocomplete="current-password" style="text-align:center;font-size:20px;letter-spacing:6px" aria-label="الرقم السري">
  <button class="btn pri" style="width:100%;margin-top:12px" id="loginBtn">دخول</button></form>
  <div class="err" id="loginErr" role="alert"></div>
</div>

<div id="appView" hidden>
  <header class="top wrap"><img src="logo.png" alt=""><h1>إدارة السواقين</h1><button class="btn ghost" id="logout">خروج</button></header>
  <main class="wrap">
    <div class="share">السواقين يدخلون من الرابط <code id="drvLink"></code> برقم جوالهم والرقم السري اللي تحدده لهم هنا.</div>
    <div class="bar"><h2>السواقين</h2><button class="btn pri" id="add">+ سائق جديد</button></div>
    <div id="list"></div>
  </main>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="scrim" id="mScrim"></div><div class="panel">
  <h2 id="mTitle">سائق جديد</h2>
  <div class="field"><label class="lbl" for="eName">الاسم</label><input class="f" id="eName" maxlength="60"></div>
  <div class="field"><label class="lbl" for="ePhone">رقم الجوال</label><div class="phone"><span>+971</span><input id="ePhone" type="tel" inputmode="tel" placeholder="5X XXX XXXX" maxlength="13"></div></div>
  <div class="field"><label class="lbl" for="eBranch">الفرع</label><select class="f" id="eBranch"></select><p class="hint">السائق يشوف طلبات فرعه بس، أو كل الفروع لو اخترت "كل الفروع".</p></div>
  <div class="field"><label class="lbl" for="ePin" id="ePinL">الرقم السري (4 أرقام)</label><input class="f" id="ePin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" style="letter-spacing:6px"></div>
  <label class="switch"><input type="checkbox" id="eActive" checked> <span>الحساب مفعّل (إيقافه يطلّع السائق فوراً)</span></label>
  <div style="display:flex;gap:8px"><button class="btn pri" id="eSave">حفظ</button><button class="btn ghost" id="eCancel">إلغاء</button></div>
  <div class="err" id="eErr" role="alert"></div>
</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
var SB='https://dhqgorvtwgzekmmjztyr.supabase.co', KEY='sb_publishable_yAYV8YXgiq3DxyJZPqELXw_QbzvL5Fe';
var H={apikey:KEY,'Content-Type':'application/json',Accept:'application/json'};
function rpc(fn,b){return fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:H,body:JSON.stringify(b)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error('net');return j;});});}
function rest(p){return fetch(SB+'/rest/v1/'+p,{headers:H}).then(function(r){if(!r.ok)throw new Error('net');return r.json();});}
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var ERR={bad_pin:'الرقم السري غلط.',locked:'محاولات كثيرة غلط. جرّب بعد 10 دقائق.',bad_phone:'رقم الجوال غير صحيح.',bad_name:'اكتب الاسم.',bad_pin_format:'الرقم السري لازم 4 أرقام.',phone_taken:'هالرقم مسجّل لسائق ثاني.',net:'تعذّر الاتصال، تأكد من الإنترنت.'};
function msg(e){return ERR[e]||ERR.net;}
var tt;function toast(s){var t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show');},2200);}
var PIN=null;try{PIN=sessionStorage.getItem('rq-admin-pin');}catch(e){}
var BR=[],DR=[],cur=null;
$('#drvLink').textContent=location.origin.replace(/^https?:\/\//,'')+'/driver';

$('#loginForm').addEventListener('submit',function(e){e.preventDefault();var p=$('#pin').value.trim(),b=$('#loginBtn');b.disabled=true;
  rpc('menu_admin_login',{p:p}).then(function(s){if(s!=='ok')throw new Error(s);PIN=p;try{sessionStorage.setItem('rq-admin-pin',p);}catch(e){}start();}).catch(function(err){$('#loginErr').textContent=msg(err.message);}).finally(function(){b.disabled=false;});});
$('#logout').onclick=function(){try{sessionStorage.removeItem('rq-admin-pin');}catch(e){}location.reload();};

function since(s){if(!s)return 'ما شاركت موقع للحين';var m=Math.round((Date.now()-new Date(s).getTime())/60000);return m<2?'آخر موقع الحين':m<60?'آخر موقع قبل '+m+' د':m<1440?'آخر موقع قبل '+Math.floor(m/60)+' س':'آخر موقع قبل أيام';}
function bname(id){var b=BR.find(function(x){return x.id===id;});return b?b.name_ar:'كل الفروع';}
function render(){$('#list').innerHTML=DR.length?DR.map(function(d){var st=!d.active?'<span class="pill off">موقوف</span>':d.online?'<span class="pill on">متصل</span>':'<span class="pill idle">غير متصل</span>';
  return '<div class="card'+(d.active?'':' off')+'"><div><b>'+esc(d.name)+'</b> '+st+'<div><span class="ph">+'+esc(d.phone)+'</span></div><div class="meta"><span>'+esc(bname(d.branch_id))+'</span><span>طلبات معه: '+d.open+'</span><span>توصيلات اليوم: '+d.today+'</span><span>'+since(d.last_at)+'</span></div></div><button class="btn ghost" data-edit="'+esc(d.id)+'">تعديل</button></div>';}).join(''):'<p class="hint">ما فيه سواقين. أضف أول سائق.</p>';}
function load(){return rpc('app_admin_drivers',{p:PIN}).then(function(r){if(!r.ok){if(r.error==='bad_pin'||r.error==='locked'){toast(msg(r.error));setTimeout(function(){$('#logout').click();},1200);}throw new Error(r.error);}DR=r.drivers;render();});}
function start(){$('#loginView').hidden=true;$('#appView').hidden=false;rest('menu_branches?select=id,name_ar,sort&order=sort').then(function(b){BR=b;
  $('#eBranch').innerHTML='<option value="">كل الفروع</option>'+BR.map(function(x){return '<option value="'+esc(x.id)+'">'+esc(x.name_ar)+'</option>';}).join('');return load();}).catch(function(e){toast(msg(e.message));});
  setInterval(function(){if(!$('#modal').classList.contains('open'))load().catch(function(){});},30000);}

var modal=$('#modal');
function open(d){cur=d||null;$('#mTitle').textContent=d?'تعديل سائق':'سائق جديد';$('#eName').value=d?d.name:'';$('#ePhone').value=d?String(d.phone).replace(/^971/,''):'';
  $('#eBranch').value=d&&d.branch_id?d.branch_id:'';$('#ePin').value='';$('#ePinL').textContent=d?'رقم سري جديد (اتركه فاضي إذا ما تبي تغيّره)':'الرقم السري (4 أرقام)';$('#eActive').checked=d?d.active:true;$('#eErr').textContent='';
  modal.classList.add('open');$('#eName').focus();}
function close(){modal.classList.remove('open');}
$('#add').onclick=function(){open(null);};$('#eCancel').onclick=close;$('#mScrim').onclick=close;
document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
$('#list').addEventListener('click',function(e){var b=e.target.closest('[data-edit]');if(b)open(DR.find(function(d){return d.id===b.dataset.edit;}));});
$('#eSave').onclick=function(){var b=this,d={id:cur?cur.id:null,name:$('#eName').value.trim(),phone:$('#ePhone').value,branch_id:$('#eBranch').value,pin:$('#ePin').value.trim(),active:$('#eActive').checked};
  b.disabled=true;rpc('app_admin_save_driver',{p:PIN,d:d}).then(function(r){if(!r.ok)throw new Error(r.error);return load().then(function(){close();toast(cur?'تم الحفظ':'تمت إضافة السائق');});}).catch(function(err){$('#eErr').textContent=msg(err.message);}).finally(function(){b.disabled=false;});};

if(PIN){rpc('menu_admin_login',{p:PIN}).then(function(s){if(s==='ok')start();}).catch(function(){});}
})();
</script>
</body>
</html>
