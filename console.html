<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RQ Console — لوحة التحكم</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1D1813">
<link rel="manifest" href="/console.webmanifest">
<link rel="icon" href="/console-192.png">
<link rel="apple-touch-icon" href="/console-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RQ Console">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --bg:#F6F3EF;--card:#FFFFFF;--line:#E8E1D9;--ink:#1D1813;--ink2:#5A524B;--mute:#8A8179;--side:#1D1813;--side-ink:#EDE6DE;--side-mute:#9C928A;
  --brand:#E07A1F;--brand-soft:#FCEBDD;--grid:#EEE8E1;--hover:#FAF7F3;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;
  --good:#1a8a4a;--good-bg:#E5F4EA;--bad:#c93a3a;--bad-bg:#FBE7E7;--warn:#a96a00;--warn-bg:#FDF1DA}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#141210;--card:#1E1B18;--line:#332E29;--ink:#F3EEE8;--ink2:#C9C0B6;--mute:#958C83;--side:#0E0C0B;--side-ink:#EDE6DE;--side-mute:#857B73;
  --brand:#F08A2A;--brand-soft:#3A2614;--grid:#2A2622;--hover:#25211D;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;
  --good:#4cc47e;--good-bg:#173323;--bad:#ef6b6b;--bad-bg:#3a1b1b;--warn:#e7a73a;--warn-bg:#3a2c12}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.hidden{display:none!important}
a{color:inherit}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--side)}
.lbox{background:var(--card);border-radius:24px;padding:30px 24px;width:100%;max-width:360px;text-align:center}
.lbox .logo{height:48px}
.lbox h1{font-size:20px;margin:10px 0 2px}.lbox p{color:var(--mute);margin:0 0 16px;font-size:13px}
.pin{width:100%;font-size:26px;letter-spacing:.35em;text-align:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.btn{border:0;border-radius:11px;padding:9px 15px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn.red{background:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.lbox .btn{width:100%;justify-content:center;margin-top:12px;padding:13px;font-size:16px}
.err{color:var(--bad);min-height:20px;margin-top:8px;font-size:13px}
/* layout */
#app{display:flex;min-height:100vh}
aside{width:228px;flex-shrink:0;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:16px 12px}
aside .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
aside .brand img{height:30px;background:#fff;border-radius:8px;padding:3px 6px}
aside .brand b{font-size:15px;letter-spacing:.3px}aside .brand small{display:block;color:var(--side-mute);font-size:11px;font-weight:400}
aside nav{display:flex;flex-direction:column;gap:2px;flex:1}
aside nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--side-ink);opacity:.85;cursor:pointer}
aside nav a:hover{background:#ffffff12;opacity:1}
aside nav a.on{background:var(--brand);color:#fff;opacity:1;font-weight:600}
aside nav a i{font-style:normal;width:20px;text-align:center}
aside .foot{border-top:1px solid #ffffff1c;padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
aside .foot .who{color:var(--side-mute);padding:0 8px}
aside .foot button{background:transparent;border:0;color:var(--side-ink);text-align:start;padding:7px 12px;border-radius:9px;cursor:pointer;opacity:.85}
aside .foot button:hover{background:#ffffff12}
.content{flex:1;min-width:0}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:1280px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topin h1{font-size:18px;margin:0;flex:1;white-space:nowrap}
.topin .upd{color:var(--mute);font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;flex-wrap:wrap}
.chips button{border:0;background:transparent;padding:5px 10px;border-radius:9px;cursor:pointer;color:var(--ink2);font-size:13px}
.chips button.on{background:var(--brand);color:#fff;font-weight:600}
select,input:not([type]),input[type=date],input[type=text],input[type=search],input[type=number],input[type=password],textarea,.inp{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
main{max-width:1280px;margin:0 auto;padding:14px 18px 90px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;min-width:0}
.card h2{font-size:14px;margin:0 0 10px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sp,.sp{flex:1}
.kpi .l{color:var(--mute);font-size:12.5px}.kpi .v{font-size:25px;font-weight:700;margin-top:2px}.kpi .v small{font-size:13px;color:var(--mute);font-weight:500}
.delta{direction:ltr;unicode-bidi:isolate;display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:20px;margin-inline-start:6px;vertical-align:middle}
.delta.up{background:var(--good-bg);color:var(--good)}.delta.down{background:var(--bad-bg);color:var(--bad)}.delta.flat{background:var(--grid);color:var(--mute)}
.two{grid-template-columns:2fr 1fr}.half{grid-template-columns:1fr 1fr}
.live{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.lv{display:flex;flex-direction:column;gap:4px}.lv b{font-size:15px}.lv .row{display:flex;justify-content:space-between;color:var(--ink2);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.pill.open,.pill.ready,.pill.on{background:var(--good-bg);color:var(--good)}.pill.closed,.pill.done,.pill.off{background:var(--grid);color:var(--mute)}
.pill.new{background:var(--warn-bg);color:var(--warn)}.pill.cancelled,.pill.bad{background:var(--bad-bg);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mute);font-weight:500;text-align:start;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
td{padding:8px;border-bottom:1px solid var(--grid);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover td{background:var(--hover)}
tfoot td{font-weight:700;border-top:1px solid var(--line)}
.scroll{overflow:auto;max-height:470px}
.bar{height:8px;border-radius:4px;background:var(--brand);min-width:2px}
.hb{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;margin:7px 0}
.hb .t{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .track{background:var(--grid);border-radius:4px;height:10px;overflow:hidden}.hb .fill{height:100%;border-radius:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
svg.chart{width:100%;height:240px;display:block;overflow:visible}
svg.chart text{fill:var(--mute);font-size:11px;font-family:inherit}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;border-radius:10px;padding:7px 10px;z-index:40;line-height:1.5;white-space:nowrap;opacity:0;transition:opacity .1s}
.empty{color:var(--mute);text-align:center;padding:26px 0}
.muted{color:var(--mute)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 14px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:200px}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;color:var(--mute)}
/* modal */
.ov{position:fixed;inset:0;background:#0007;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.mdl{background:var(--card);border-radius:20px;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:18px 20px;border:1px solid var(--line)}
.mdl h3{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
.mdl .x{margin-inline-start:auto;background:transparent;border:0;font-size:20px;cursor:pointer;color:var(--mute)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.fld label{font-size:12.5px;color:var(--mute)}
.fld input,.fld select,.fld textarea{width:100%}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}.kv span:nth-child(odd){color:var(--mute)}
.tl{border-inline-start:2px solid var(--line);padding-inline-start:12px;margin:6px 0}
.tl div{margin:6px 0;font-size:13px}.tl small{color:var(--mute)}
.switch{position:relative;width:40px;height:22px;flex-shrink:0;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:22px;background:var(--line);transition:.15s;cursor:pointer}
.switch span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked+span{background:var(--good)}
.switch input:checked+span::after{inset-inline-start:21px}
.mimg{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--grid);display:block}
.pricein{width:90px;text-align:center}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;transition:.2s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.mnav{display:none}
@media (max-width:900px){
  aside{display:none}
  .two,.half{grid-template-columns:1fr}
  .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--side);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto;gap:2px}
  .mnav a{flex:1;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--side-ink);opacity:.75;text-decoration:none;font-size:10.5px;padding:4px 2px;border-radius:9px}
  .mnav a i{font-style:normal;font-size:17px}
  .mnav a.on{opacity:1;color:#fff;background:#ffffff1a}
  .top{position:static}
  .topin{padding:10px 12px;gap:8px}.topin h1{font-size:16px}
  .filters{width:100%;flex-wrap:nowrap}.filters select{flex-shrink:0;max-width:40%}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips button{white-space:nowrap}
  #custom{width:100%;display:flex;gap:6px;align-items:center}#custom input{flex:1;min-width:0}
  .filters:has(#custom:not(.hidden)){flex-wrap:wrap}
  main{padding:12px 12px 100px}
  .live{grid-template-columns:1fr 1fr}.live .card{padding:10px 12px}.lv b{font-size:13px}.lv .row{font-size:12px}
  .kpi .v{font-size:21px}.hb{grid-template-columns:72px 1fr auto}
  .frow{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="login">
  <div class="lbox">
    <img class="logo" src="/logo.png" alt="RQ Kitchen">
    <h1>RQ Console</h1>
    <p>لوحة التحكم — ادخل برمز المدير<br>(رمز الفرع يعرض فرعه فقط)</p>
    <input id="pin" class="pin num" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••">
    <button class="btn" id="go">دخول</button>
    <div class="err" id="lerr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <aside>
    <div class="brand"><img src="/logo.png" alt=""><div><b>RQ Console</b><small>لوحة التحكم</small></div></div>
    <nav id="nav"></nav>
    <div class="foot">
      <div class="who" id="who"></div>
      <button id="themeBtn">🌙 الوضع الليلي/النهاري</button>
      <button id="cashLink">🧾 فتح الكاشير</button>
      <button id="outBtn">⎋ خروج</button>
    </div>
  </aside>
  <div class="content">
    <div class="top"><div class="topin">
      <h1 id="title"></h1>
      <span class="upd" id="upd"></span>
      <div class="filters" id="gf">
        <select id="branch"></select>
        <div class="chips" id="per">
          <button data-p="today" class="on">اليوم</button><button data-p="yest">أمس</button><button data-p="7">٧ أيام</button>
          <button data-p="month">هذا الشهر</button><button data-p="last">الشهر الماضي</button><button data-p="custom">مخصص</button>
        </div>
        <span id="custom" class="hidden"><input type="date" id="d1"> — <input type="date" id="d2"></span>
      </div>
      <button class="btn ghost sm" id="refresh" title="تحديث">↻</button>
    </div></div>
    <main id="main"></main>
  </div>
  <nav class="mnav" id="mnav"></nav>
</div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
const SB="https://dhqgorvtwgzekmmjztyr.supabase.co", KEY="sb_publishable_yAYV8YXgiq3DxyJZPqELXw_QbzvL5Fe";
const MENU_IMG_BASE="https://menu.rqkitchen.app/", CASHIER="https://cashier.rqkitchen.app/";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
async function rpc(fn,args){
  const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify(args||{})});
  const t=await r.text(); let j=null; try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const e=new Error((j&&j.message)||t||r.status);e.server=true;throw e}
  return j;
}
const money=n=>(+n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const int=n=>(+n||0).toLocaleString("en-US");
const short=n=>{n=+n||0;return n>=1000?(n/1000).toFixed(n>=10000?0:1)+"k":String(Math.round(n))};
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2600)};
const dt=s=>new Date(s).toLocaleString("en-GB",{timeZone:"Asia/Dubai",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const hm=s=>s?new Date(s).toLocaleTimeString("en-GB",{timeZone:"Asia/Dubai",hour:"2-digit",minute:"2-digit"}):"";
// theme
const setTheme=t=>{document.documentElement.dataset.theme=t;LS.set("con.theme",t)};
setTheme(LS.get("con.theme",matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
$("#themeBtn").onclick=()=>{setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");route()};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
// business day: 5am cutoff, Dubai
const ymd=d=>d.toISOString().slice(0,10);
const today=()=>ymd(new Date(Date.now()+4*3600e3-5*3600e3));
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return ymd(d)};

let token=LS.get("con.token",null), role=null, myBranch=null, settings={}, apps=[], branches=[], per=LS.get("con.per","today");
const isAdmin=()=>role==="admin";
const BR_COLOR={b1:"--s1",b2:"--s2",b3:"--s3",b4:"--s4",bdemo:"--s5"};
const bName=id=>(branches.find(b=>b.id===id)||{}).name||id;
const appName=id=>(apps.find(a=>a.id===id)||{}).name||id;
const payName=k=>k==="cash"?"كاش":k==="visa"?"فيزا":k==="unpaid"?"غير مدفوع":k&&k.startsWith("app:")?appName(k.slice(4)):apps.some(a=>a.id===k)?appName(k):k;
const STATUS={new:"جديد",ready:"جاهز",done:"تم التسليم",cancelled:"ملغي"};
const MODE={car:"سيارة",phone:"هاتف","-":"تطبيقات"};
const ident=o=>o.channel?(appName(o.channel)+(o.app_ref?" #"+o.app_ref:"")):o.mode==="car"&&o.car?[o.car.em,o.car.num,o.car.color].filter(Boolean).join(" "):o.phone||"";

const PAGES=[
  {id:"home",t:"الرئيسية",i:"📊",filters:true},
  {id:"orders",t:"الطلبات",i:"🧾",filters:true},
  {id:"reports",t:"التقارير",i:"📈",filters:true},
  {id:"menu",t:"المنيو",i:"🍔"},
  {id:"apps",t:"التطبيقات",i:"🛵",admin:true},
  {id:"cashiers",t:"الكاشيرية",i:"👤",admin:true},
  {id:"settings",t:"الإعدادات",i:"⚙️"},
];

// ---------- login ----------
async function login(){
  const p=$("#pin").value.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g,"");
  if(p.length<4){$("#lerr").textContent="اكتب الرمز";return}
  $("#go").disabled=true; $("#lerr").textContent="";
  try{
    const r=await rpc("inv_login",{p_pin:p});
    if(!r){$("#lerr").textContent="الرمز غير صحيح";return}
    if(r.role!=="admin"&&r.role!=="branch"){$("#lerr").textContent="هذا الرمز ما له صلاحية على لوحة التحكم";return}
    token=r.token; LS.set("con.token",token); start();
  }catch(e){$("#lerr").textContent=/locked/.test(e.message)?"محاولات كثيرة — انتظر ١٥ دقيقة":"تعذّر الاتصال، حاول مرة ثانية"}
  finally{$("#go").disabled=false}
}
$("#go").onclick=login; $("#pin").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
$("#outBtn").onclick=()=>{LS.del("con.token");token=null;location.hash="";location.reload()};
$("#cashLink").onclick=()=>window.open(CASHIER,"_blank");

async function start(){
  try{
    const c=await rpc("pos_ctx",{p_token:token});
    role=c.role; myBranch=c.branch_id; branches=c.branches||[]; settings=c.settings||{};
    try{apps=JSON.parse(settings.apps||"[]")||[]}catch(e){apps=[]}
  }catch(e){
    if(e.server&&/auth|forbidden/.test(e.message)){ LS.del("con.token"); token=null; $("#login").classList.remove("hidden"); $("#app").classList.add("hidden"); return }
    $("#lerr").textContent="تعذّر الاتصال — تأكد من الإنترنت"; setTimeout(start,5000); return }
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#who").textContent=isAdmin()?"👑 المدير — كل الفروع":"🏪 فرع "+bName(myBranch);
  const sel=$("#branch");

function table(el,head,rows,opts={}){

}
function hbars(el,rows,color,pct){
  if(!rows.length){el.innerHTML=`<div class="empty">لا يوجد</div>`;return}
  const max=Math.max(1,...rows.map(r=>r.v)), tot=rows.reduce((s,r)=>s+r.v,0)||1;
  el.innerHTML=rows.map(r=>`<div class="hb"><span class="t">${esc(r.t)}</span><div class="track"><div class="fill" style="width:${(r.v/max*100).toFixed(1)}%;background:var(${color})"></div></div><span class="num">${r.lab}${pct?` <span class="muted">(${Math.round(r.v/tot*100)}%)</span>`:""}</span></div>`).join("");
}
function stackBars(svg,data){
  const W=svg.clientWidth||600,H=240,pl=4,pr=38,pt=10,pb=26;
  const max=Math.max(1,...data.map(d=>d.parts.reduce((s,p)=>s+p.v,0)));
  const e=Math.pow(10,Math.floor(Math.log10(max))), m=max/e, nice=(m<=1?1:m<=2?2:m<=5?5:10)*e;
  const iw=W-pl-pr, ih=H-pt-pb, n=data.length||1, bw=Math.max(4,Math.min(46,iw/n*0.62)), step=iw/n, y=v=>pt+ih-v/nice*ih;
  let g="";
  for(let i=0;i<=4;i++){const v=nice/4*i,yy=y(v); g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="${css("--grid")}"/><text x="${W-pr+6}" y="${yy+4}">${short(v)}</text>`}
  const every=Math.ceil(n/12);
  data.forEach((d,i)=>{
    const cx=W-pr-step*(i+.5); let acc=0; const segs=d.parts.filter(p=>p.v>0);
    segs.forEach((p,j)=>{const y0=y(acc),y1=y(acc+p.v); acc+=p.v; const top=j===segs.length-1;
      g+=top?`<path d="${roundTop(cx-bw/2,y1,bw,y0-y1,Math.min(4,bw/2))}" fill="${css(p.color)}"/>`:`<rect x="${cx-bw/2}" y="${y1+2}" width="${bw}" height="${Math.max(0,y0-y1-2)}" fill="${css(p.color)}"/>`});
    if(i%every===0) g+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${esc(d.label)}</text>`;
    g+=`<rect class="hit" data-i="${i}" x="${cx-step/2}" y="${pt}" width="${step}" height="${ih}" fill="transparent"/>`;
  });
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="${css("--line")}"/>`;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.innerHTML=g;
  if(!data.some(d=>d.parts.some(p=>p.v>0))) svg.innerHTML+=`<text x="${W/2}" y="${H/2}" text-anchor="middle" style="font-size:13px">لا توجد مبيعات في هذه الفترة</text>`;
  const tip=$("#tip");
  const show=(e,t)=>{const h=t.closest&&t.closest(".hit"); if(!h){tip.style.opacity=0;return}
    const d=data[+h.dataset.i], tot=d.parts.reduce((s,p)=>s+p.v,0);
    tip.innerHTML=`<b>${esc(d.title)}</b><br>`+(d.parts.length>1?d.parts.map(p=>`${esc(bName(p.k))}: <span class="num">${money(p.v)}</span>`).join("<br>")+"<br>":"")+`الإجمالي: <span class="num">${money(tot)}</span> د.إ`;
    tip.style.opacity=1; tip.style.left=Math.max(8,Math.min(innerWidth-tip.offsetWidth-8,e.clientX+12))+"px"; tip.style.top=Math.max(8,e.clientY-tip.offsetHeight-10)+"px"};
  svg.onmousemove=e=>show(e,e.target); svg.onmouseleave=()=>tip.style.opacity=0;
  svg.ontouchstart=e=>{const t=e.touches[0]; show(t,document.elementFromPoint(t.clientX,t.clientY)); setTimeout(()=>tip.style.opacity=0,2200)};
}
function roundTop(x,y,w,h,r){if(h<=0)return"";r=Math.min(r,h);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}

  $("#main").innerHTML=`<div class="card">
    <h2>إضافة كاشير</h2>
    <div class="toolbar"><input type="text" id="cn" placeholder="اسم الكاشير" style="flex:1;min-width:160px"><input type="password" id="cp" class="num" inputmode="numeric" maxlength="8" placeholder="الرقم السري (٤–٨ أرقام)" style="width:200px"><button class="btn" id="cadd">＋ إضافة</button></div>
    <div class="err" id="cerr"></div>
    <div class="muted" style="font-size:12.5px;margin-bottom:10px">كل كاشير يقدر يسجّل في أي فرع: يختار الفرع ثم رقمه السري. الرقم السري لازم يكون مختلف لكل كاشير.</div>
    <table id="ctb"></table></div>`;
  table($("#ctb"),["الكاشير","الحالة",""],list.map(c=>[`👤 <b>${esc(c.name)}</b>`,`<span class="pill ${c.active?"on":"off"}">${c.active?"فعّال":"موقوف"}</span>`,`<button class="btn ghost sm" data-ce="${c.id}">تعديل</button>`]),{empty:"لا يوجد كاشير — أضف من فوق"});
  const err=t=>$("#cerr").textContent=t;
  const msg=e=>/pin_taken/.test(e.message)?"الرقم السري مستخدم لكاشير ثاني":/pin_format/.test(e.message)?"الرقم السري من ٤ إلى ٨ أرقام":/name/.test(e.message)?"اكتب الاسم":"تعذّر الحفظ";
  $("#cadd").onclick=async()=>{ const n=$("#cn").value.trim(), p=$("#cp").value.replace(/\D/g,""); if(!n) return err("اكتب الاسم"); if(p.length<4) return err("الرقم السري من ٤ إلى ٨ أرقام");
    try{ await rpc("pos_cashier_save",{p_token:token,p_id:null,p_branch:"all",p_name:n,p_pin:p,p_active:true}); toast("تمت إضافة "+n+" ✓"); pCashiers(); }catch(e){ err(msg(e)); } };
  $("#ctb").onclick=e=>{ const b=e.target.closest("[data-ce]"); if(!b) return; const c=list.find(x=>x.id===b.dataset.ce);
    const m=modal(`<h3>تعديل ${esc(c.name)}<button class="x" data-x>✕</button></h3>
      <div class="fld"><label>الاسم</label><input id="en" value="${esc(c.name)}"></div>
      <div class="fld"><label>رقم سري جديد (اتركه فاضي إذا ما تبي تغيّره)</label><input id="ep" class="num" type="password" inputmode="numeric" maxlength="8"></div>
      <label style="display:flex;gap:8px;align-items:center"><span class="switch"><input type="checkbox" id="ea" ${c.active?"checked":""}><span></span></span>فعّال (الموقوف ما يقدر يدخل)</label>
      <div class="err" id="eerr"></div><div class="mact"><button class="btn ghost" data-x>إلغاء</button><button class="btn" id="esave">💾 حفظ</button></div>`);
    m.querySelector("#esave").onclick=async()=>{ const p=$("#ep").value.replace(/\D/g,""); if(p&&p.length<4){$("#eerr").textContent="الرقم السري من ٤ إلى ٨ أرقام";return}
      try{ await rpc("pos_cashier_save",{p_token:token,p_id:c.id,p_branch:"all",p_name:$("#en").value.trim(),p_pin:p||null,p_active:$("#ea").checked}); closeModal(); toast("تم الحفظ ✓"); pCashiers(); }catch(e){ $("#eerr").textContent=msg(e); } };
  };
}

// ---------- SETTINGS ----------
async function pSettings(){
  const admin=isAdmin();
  $("#main").innerHTML=`<div class="grid half">
    <div class="card"><h2>الفاتورة</h2>
      <div class="fld"><label>الرقم الضريبي (TRN)</label><input id="strn" class="num" value="${esc(settings.trn||"")}" ${admin?"":"disabled"}></div>
      <div class="fld"><label>النص أسفل الفاتورة</label><textarea id="sfoot" rows="2" ${admin?"":"disabled"}>${esc(settings.footer||"")}</textarea></div>
      ${admin?`<div class="mact"><button class="btn" id="ssave">💾 حفظ</button></div>`:""}</div>
    <div class="card"><h2>روابط سريعة</h2>
      <div style="display:flex;flex-direction:column;gap:8px">
        <a class="btn ghost" href="${CASHIER}" target="_blank">🧾 تطبيق الكاشير</a>
        <a class="btn ghost" href="https://inventory.rqkitchen.app/" target="_blank">📦 تطبيق الجرد</a>
        <a class="btn ghost" href="https://track.rqkitchen.app/" target="_blank">🔔 صفحة تتبع الطلبات</a>
        <a class="btn ghost" href="https://apps.rqkitchen.app/" target="_blank">⬇ تحميل تطبيقات الموظفين</a>
      </div>
      <div class="muted" style="font-size:12.5px;margin-top:12px">الطابعة وإعدادات الجهاز تُضبط من داخل تطبيق الكاشير في كل فرع.</div></div>
  </div>`;
  if(admin) $("#ssave").onclick=async()=>{ try{ await rpc("pos_save_settings",{p_token:token,p_trn:$("#strn").value.trim(),p_footer:$("#sfoot").value.trim()}); settings.trn=$("#strn").value.trim(); settings.footer=$("#sfoot").value.trim(); toast("تم الحفظ ✓"); }catch(e){ toast("تعذّر الحفظ"); } };
}

// ---------- boot ----------
try{ const m=location.hash.match(/[#&?]t=([0-9a-f]{20,})/); if(m){ token=m[1]; LS.set("con.token",token); history.replaceState(null,"",location.pathname+"#home"); } }catch(e){}
if("serviceWorker" in navigator && !window.RQ_NATIVE) navigator.serviceWorker.register("/console-sw.js",{scope:"/"}).catch(()=>{});
if(token) start(); else setTimeout(()=>$("#pin").focus(),50);
</script>
</body>
