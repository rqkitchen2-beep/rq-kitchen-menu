<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RQ Console — لوحة التحكم</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0c0e">
<link rel="manifest" href="/console.webmanifest">
<link rel="icon" href="/console-192.png">
<link rel="apple-touch-icon" href="/console-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RQ Console">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --bg:#f4f4f6;--card:#ffffff;--line:#e6e6ec;--ink:#141417;--ink2:#4b4b55;--mute:#80808c;--side:#ffffff;--side-ink:#4b4b55;--side-mute:#80808c;
  --brand:#f47a20;--brand2:#d9600a;--brand-soft:rgba(244,122,32,.12);--grid:#ececf1;--hover:#f7f7fa;--surface2:#f3f3f6;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;
  --good:#15803d;--good-bg:rgba(34,197,94,.13);--bad:#dc2626;--bad-bg:rgba(239,68,68,.12);--warn:#a16207;--warn-bg:rgba(234,179,8,.15);--shadow:0 1px 2px rgba(20,20,30,.05)}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0c0c0e;--card:#151518;--line:#26262c;--ink:#f4f4f5;--ink2:#b4b4bd;--mute:#7c7c87;--side:#121215;--side-ink:#b4b4bd;--side-mute:#7c7c87;
  --brand:#f47a20;--brand2:#ff9a4d;--brand-soft:rgba(244,122,32,.14);--grid:#202026;--hover:#1c1c20;--surface2:#1c1c20;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;
  --good:#22c55e;--good-bg:rgba(34,197,94,.13);--bad:#ef4444;--bad-bg:rgba(239,68,68,.13);--warn:#eab308;--warn-bg:rgba(234,179,8,.14);--shadow:0 1px 0 rgba(255,255,255,.03) inset}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.hidden{display:none!important}
a{color:inherit}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--side)}
.lbox{background:var(--card);border-radius:24px;padding:30px 24px;width:100%;max-width:360px;text-align:center}
.lbox .logo{height:48px}
.lbox h1{font-size:20px;margin:10px 0 2px}.lbox p{color:var(--mute);margin:0 0 16px;font-size:13px}
.pin{width:100%;font-size:26px;letter-spacing:.35em;text-align:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.btn{border:0;border-radius:11px;padding:9px 15px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn.red{background:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.lbox .btn{width:100%;justify-content:center;margin-top:12px;padding:13px;font-size:16px}
.err{color:var(--bad);min-height:20px;margin-top:8px;font-size:13px}
/* layout */
#app{display:flex;min-height:100vh}
aside{width:228px;flex-shrink:0;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:16px 12px}
aside .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
aside .brand img{height:30px;background:#fff;border-radius:8px;padding:3px 6px}
aside .brand b{font-size:15px;letter-spacing:.3px}aside .brand small{display:block;color:var(--side-mute);font-size:11px;font-weight:400}
aside nav{display:flex;flex-direction:column;gap:2px;flex:1}
aside nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--side-ink);opacity:.85;cursor:pointer}
aside nav a:hover{background:#ffffff12;opacity:1}
aside nav a.on{background:var(--brand);color:#fff;opacity:1;font-weight:600}
aside nav a i{font-style:normal;width:20px;text-align:center}
aside .foot{border-top:1px solid #ffffff1c;padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
aside .foot .who{color:var(--side-mute);padding:0 8px}
aside .foot button{background:transparent;border:0;color:var(--side-ink);text-align:start;padding:7px 12px;border-radius:9px;cursor:pointer;opacity:.85}
aside .foot button:hover{background:#ffffff12}
.content{flex:1;min-width:0}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:1280px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topin h1{font-size:18px;margin:0;flex:1;white-space:nowrap}
.topin .upd{color:var(--mute);font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;flex-wrap:wrap}
.chips button{border:0;background:transparent;padding:5px 10px;border-radius:9px;cursor:pointer;color:var(--ink2);font-size:13px}
.chips button.on{background:var(--brand);color:#fff;font-weight:600}
select,input:not([type]),input[type=date],input[type=text],input[type=search],input[type=number],input[type=password],textarea,.inp{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
main{max-width:1280px;margin:0 auto;padding:14px 18px 90px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;min-width:0}
.card h2{font-size:14px;margin:0 0 10px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sp,.sp{flex:1}
.kpi .l{color:var(--mute);font-size:12.5px}.kpi .v{font-size:25px;font-weight:700;margin-top:2px}.kpi .v small{font-size:13px;color:var(--mute);font-weight:500}
.delta{direction:ltr;unicode-bidi:isolate;display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:20px;margin-inline-start:6px;vertical-align:middle}
.delta.up{background:var(--good-bg);color:var(--good)}.delta.down{background:var(--bad-bg);color:var(--bad)}.delta.flat{background:var(--grid);color:var(--mute)}
.two{grid-template-columns:2fr 1fr}.half{grid-template-columns:1fr 1fr}
.live{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.lv{display:flex;flex-direction:column;gap:4px}.lv b{font-size:15px}.lv .row{display:flex;justify-content:space-between;color:var(--ink2);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.pill.open,.pill.ready,.pill.on{background:var(--good-bg);color:var(--good)}.pill.closed,.pill.done,.pill.off{background:var(--grid);color:var(--mute)}
.pill.new{background:var(--warn-bg);color:var(--warn)}.pill.cancelled,.pill.bad{background:var(--bad-bg);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mute);font-weight:500;text-align:start;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
td{padding:8px;border-bottom:1px solid var(--grid);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover td{background:var(--hover)}
tfoot td{font-weight:700;border-top:1px solid var(--line)}
.scroll{overflow:auto;max-height:470px}
.bar{height:8px;border-radius:4px;background:var(--brand);min-width:2px}
.hb{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;margin:7px 0}
.hb .t{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .track{background:var(--grid);border-radius:4px;height:10px;overflow:hidden}.hb .fill{height:100%;border-radius:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
svg.chart{width:100%;height:240px;display:block;overflow:visible}
svg.chart text{fill:var(--mute);font-size:11px;font-family:inherit}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;border-radius:10px;padding:7px 10px;z-index:40;line-height:1.5;white-space:nowrap;opacity:0;transition:opacity .1s}
.empty{color:var(--mute);text-align:center;padding:26px 0}
.muted{color:var(--mute)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 14px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:200px}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;color:var(--mute)}
/* modal */
.ov{position:fixed;inset:0;background:#0007;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.mdl{background:var(--card);border-radius:20px;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:18px 20px;border:1px solid var(--line)}
.mdl h3{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
.mdl .x{margin-inline-start:auto;background:transparent;border:0;font-size:20px;cursor:pointer;color:var(--mute)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.fld label{font-size:12.5px;color:var(--mute)}
.fld input,.fld select,.fld textarea{width:100%}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}.kv span:nth-child(odd){color:var(--mute)}
.tl{border-inline-start:2px solid var(--line);padding-inline-start:12px;margin:6px 0}
.tl div{margin:6px 0;font-size:13px}.tl small{color:var(--mute)}
.switch{position:relative;width:40px;height:22px;flex-shrink:0;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:22px;background:var(--line);transition:.15s;cursor:pointer}
.switch span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked+span{background:var(--good)}
.switch input:checked+span::after{inset-inline-start:21px}
.mimg{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--grid);display:block}
.pricein{width:90px;text-align:center}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;transition:.2s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.mnav{display:none}
@media (max-width:900px){
  aside{display:none}
  .two,.half{grid-template-columns:1fr}
  .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--side);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto;gap:2px}
  .mnav a{flex:1;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--side-ink);opacity:.75;text-decoration:none;font-size:10.5px;padding:4px 2px;border-radius:9px}
  .mnav a i{font-style:normal;font-size:17px}
  .mnav a.on{opacity:1;color:#fff;background:#ffffff1a}
  .top{position:static}
  .topin{padding:10px 12px;gap:8px}.topin h1{font-size:16px}
  .filters{width:100%;flex-wrap:nowrap}.filters select{flex-shrink:0;max-width:40%}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips button{white-space:nowrap}
  #custom{width:100%;display:flex;gap:6px;align-items:center}#custom input{flex:1;min-width:0}
  .filters:has(#custom:not(.hidden)){flex-wrap:wrap}
  main{padding:12px 12px 100px}
  .live{grid-template-columns:1fr 1fr}.live .card{padding:10px 12px}.lv b{font-size:13px}.lv .row{font-size:12px}
  .kpi .v{font-size:21px}.hb{grid-template-columns:72px 1fr auto}
  .frow{grid-template-columns:1fr}
}

/* ===== RQ design (same look as the owner app) ===== */
body{font-size:14.5px}
.brandmark{display:flex;align-items:baseline;gap:8px;direction:ltr}
.brandmark .rq{font-family:Pacifico,cursive;color:var(--brand);font-size:34px;line-height:1}
.brandmark .k{font-weight:700;letter-spacing:4px;font-size:12.5px;color:var(--ink2)}
#login{background:radial-gradient(120% 70% at 50% 0%,#2a1708 0%,var(--bg) 60%)}
:root:not([data-theme="dark"]) #login{background:radial-gradient(120% 70% at 50% 0%,#ffe6d1 0%,var(--bg) 60%)}
.lbox{background:transparent;padding:10px}
.lbox .brandmark{justify-content:center}.lbox .brandmark .rq{font-size:48px}
.lbox h1{font-size:20px;margin:16px 0 4px}
.pin{background:var(--card);border-radius:16px;padding:14px;font-size:28px}
.lbox .btn{border-radius:14px}
.btn{border-radius:12px;padding:9px 16px}
.btn.ghost{background:var(--card)}
aside{background:var(--side);border-inline-end:1px solid var(--line);padding:20px 14px;width:240px}
aside .brand{padding:4px 8px 22px}
aside nav{gap:3px}
aside nav a{padding:10px 12px;border-radius:12px;color:var(--side-ink);opacity:1;font-weight:600;font-size:14px}
aside nav a:hover{background:var(--hover)}
aside nav a.on{background:var(--brand-soft);color:var(--brand2)}
aside .foot{border-top:1px solid var(--line)}
aside .foot button{color:var(--side-ink);opacity:1;border-radius:10px}
aside .foot button:hover{background:var(--hover)}
.top{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.topin{padding:14px 22px}
.topin h1{font-size:20px;font-weight:700}
.chips{background:transparent;border:0;padding:0;gap:6px}
.chips button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;color:var(--ink2)}
.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
select,input:not([type]),input[type=date],input[type=text],input[type=search],input[type=number],input[type=password],textarea,.inp{border-radius:12px;padding:8px 11px}
main{padding:18px 22px 90px}
.card{border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.card h2{font-size:15px;color:var(--ink);font-weight:700}
.kpis .card:first-child{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 18%,var(--card)) 0%,var(--card) 70%);border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}
.kpi .l{font-weight:600}.kpi .v{font-size:26px}
.tabs button.on{color:var(--brand2);border-bottom-color:var(--brand)}
.pill{border-radius:999px}
.mdl{border-radius:22px}
th{background:var(--card)}
@media (max-width:900px){
  .mnav{background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  .mnav a{color:var(--mute);opacity:1;font-weight:600}
  .mnav a.on{color:var(--brand);background:transparent}
  .topin{padding:10px 12px}
  main{padding:12px 12px 100px}
}
/* foodics-style nav groups + sparklines */
aside nav{overflow-y:auto}
aside nav a.ng{justify-content:flex-start}
aside nav a.ng .car{margin-inline-start:auto;font-weight:400;transition:transform .15s;opacity:.6}
aside nav a.ng:not(.open) .car{transform:rotate(90deg)}
aside nav .nsub{display:flex;flex-direction:column;gap:2px;margin:0 0 4px}
aside nav a.sub{padding:7px 12px 7px 12px;padding-inline-start:40px;font-weight:500;font-size:13.5px}
svg.spark{width:100%;height:34px;display:block;margin-top:6px}
</style>
</head>
<body>
<div id="login">
  <div class="lbox">
    <div class="brandmark"><span class="rq">RQ</span><span class="k">CONSOLE</span></div>
    <h1>لوحة التحكم</h1>
    <p>ادخل برمز الدخول الخاص فيك</p>
    <input id="pin" class="pin num" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••">
    <button class="btn" id="go">دخول</button>
    <div class="err" id="lerr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <aside>
    <div class="brand"><div class="brandmark"><span class="rq">RQ</span><span class="k">CONSOLE</span></div></div>
    <nav id="nav"></nav>
    <div class="foot">
      <div class="who" id="who"></div>
      <button id="themeBtn">🌙 الوضع الليلي/النهاري</button>
      <button id="cashLink">🧾 فتح الكاشير</button>
      <button id="outBtn">⎋ خروج</button>
    </div>
  </aside>
  <div class="content">
    <div class="top"><div class="topin">
      <h1 id="title"></h1>
      <span class="upd" id="upd"></span>
      <div class="filters" id="gf">
        <select id="branch"></select>
        <div class="chips" id="per">
          <button data-p="today" class="on">اليوم</button><button data-p="yest">أمس</button><button data-p="7">٧ أيام</button>
          <button data-p="month">هذا الشهر</button><button data-p="last">الشهر الماضي</button><button data-p="custom">مخصص</button>
        </div>
        <span id="custom" class="hidden"><input type="date" id="d1"> — <input type="date" id="d2"></span>
      </div>
      <button class="btn ghost sm" id="refresh" title="تحديث">↻</button>
    </div></div>
    <main id="main"></main>
  </div>
  <nav class="mnav" id="mnav"></nav>
</div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
const SB="https://dhqgorvtwgzekmmjztyr.supabase.co", KEY="sb_publishable_yAYV8YXgiq3DxyJZPqELXw_QbzvL5Fe";
const MENU_IMG_BASE="https://menu.rqkitchen.app/", CASHIER="https://cashier.rqkitchen.app/";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
async function rpc(fn,args){
  const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify(args||{})});
  const t=await r.text(); let j=null; try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const e=new Error((j&&j.message)||t||r.status);e.server=true;throw e}
  return j;
}
const money=n=>(+n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const int=n=>(+n||0).toLocaleString("en-US");
const short=n=>{n=+n||0;return n>=1000?(n/1000).toFixed(n>=10000?0:1)+"k":String(Math.round(n))};
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2600)};
const dt=s=>new Date(s).toLocaleString("en-GB",{timeZone:"Asia/Dubai",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const hm=s=>s?new Date(s).toLocaleTimeString("en-GB",{timeZone:"Asia/Dubai",hour:"2-digit",minute:"2-digit"}):"";
// theme
const setTheme=t=>{document.documentElement.dataset.theme=t;LS.set("con.theme",t)};

function canSee(p){
  if(p.admin&&role!=="admin") return false;
  if(p.inv&&!(role==="admin"||role==="store")) return false;
  if(role==="store"&&!perms) return !!p.inv;

function spark(vals,color){
  vals=vals.map(v=>+v||0); if(vals.length<2) return "";
  const w=120,h=34,mx=Math.max(...vals,1),st=w/(vals.length-1);
  const pts=vals.map((v,i)=>`${(i*st).toFixed(1)},${(h-2-(v/mx)*(h-6)).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="0,${h} ${pts} ${w},${h}" fill="var(${color||"--brand"})" opacity=".12" stroke="none"/><polyline points="${pts}" fill="none" stroke="var(${color||"--brand"})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}

function range(){
  const t=today();
  if(per==="today") return [t,t];
  if(per==="yest") return [addDays(t,-1),addDays(t,-1)];
  if(per==="7") return [addDays(t,-6),t];
  if(per==="month") return [t.slice(0,8)+"01",t];
  if(per==="last"){const f=t.slice(0,8)+"01";const e=addDays(f,-1);return [e.slice(0,8)+"01",e]}
  return [$("#d1").value||t,$("#d2").value||t];
}

  toast("جارِ تجهيز الملف…");
  try{ const r=await fetch(SB+"/functions/v1/export-file",{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY,Authorization:"Bearer "+KEY},body:JSON.stringify({token,name:name+".csv",text:s})});

function stackBars(svg,data){
  const W=svg.clientWidth||600,H=240,pl=4,pr=38,pt=10,pb=26;
  const max=Math.max(1,...data.map(d=>d.parts.reduce((s,p)=>s+p.v,0)));
  const e=Math.pow(10,Math.floor(Math.log10(max))), m=max/e, nice=(m<=1?1:m<=2?2:m<=5?5:10)*e;
  const iw=W-pl-pr, ih=H-pt-pb, n=data.length||1, bw=Math.max(4,Math.min(46,iw/n*0.62)), step=iw/n, y=v=>pt+ih-v/nice*ih;
  let g="";
  for(let i=0;i<=4;i++){const v=nice/4*i,yy=y(v); g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="${css("--grid")}"/><text x="${W-pr+6}" y="${yy+4}">${short(v)}</text>`}
  const every=Math.ceil(n/12);
  data.forEach((d,i)=>{
    const cx=W-pr-step*(i+.5); let acc=0; const segs=d.parts.filter(p=>p.v>0);
    segs.forEach((p,j)=>{const y0=y(acc),y1=y(acc+p.v); acc+=p.v; const top=j===segs.length-1;
      g+=top?`<path d="${roundTop(cx-bw/2,y1,bw,y0-y1,Math.min(4,bw/2))}" fill="${css(p.color)}"/>`:`<rect x="${cx-bw/2}" y="${y1+2}" width="${bw}" height="${Math.max(0,y0-y1-2)}" fill="${css(p.color)}"/>`});
    if(i%every===0) g+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${esc(d.label)}</text>`;
    g+=`<rect class="hit" data-i="${i}" x="${cx-step/2}" y="${pt}" width="${step}" height="${ih}" fill="transparent"/>`;
  });
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="${css("--line")}"/>`;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.innerHTML=g;
  if(!data.some(d=>d.parts.some(p=>p.v>0))) svg.innerHTML+=`<text x="${W/2}" y="${H/2}" text-anchor="middle" style="font-size:13px">لا توجد مبيعات في هذه الفترة</text>`;
  const tip=$("#tip");
  const show=(e,t)=>{const h=t.closest&&t.closest(".hit"); if(!h){tip.style.opacity=0;return}
    const d=data[+h.dataset.i], tot=d.parts.reduce((s,p)=>s+p.v,0);
    tip.innerHTML=`<b>${esc(d.title)}</b><br>`+(d.parts.length>1?d.parts.map(p=>`${esc(bName(p.k))}: <span class="num">${money(p.v)}</span>`).join("<br>")+"<br>":"")+`الإجمالي: <span class="num">${money(tot)}</span> د.إ`;
    tip.style.opacity=1; tip.style.left=Math.max(8,Math.min(innerWidth-tip.offsetWidth-8,e.clientX+12))+"px"; tip.style.top=Math.max(8,e.clientY-tip.offsetHeight-10)+"px"};
  svg.onmousemove=e=>show(e,e.target); svg.onmouseleave=()=>tip.style.opacity=0;
  svg.ontouchstart=e=>{const t=e.touches[0]; show(t,document.elementFromPoint(t.clientX,t.clientY)); setTimeout(()=>tip.style.opacity=0,2200)};
}
function roundTop(x,y,w,h,r){if(h<=0)return"";r=Math.min(r,h);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}

async function uploadImage(file){
  const bmp=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
  const M=1000, k=Math.min(1, M/Math.max(bmp.naturalWidth,bmp.naturalHeight)), c=document.createElement("canvas");
  c.width=Math.round(bmp.naturalWidth*k); c.height=Math.round(bmp.naturalHeight*k); c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  let type="image/webp", url=c.toDataURL(type,0.85); if(!url.startsWith("data:image/webp")){ type="image/jpeg"; url=c.toDataURL(type,0.86); }
  const r=await fetch(SB+"/functions/v1/menu-upload",{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY,Authorization:"Bearer "+KEY},body:JSON.stringify({token,type,data:url.split(",")[1]})});
  const j=await r.json().catch(()=>({})); if(!r.ok||!j.url) throw new Error(j.error||"upload"); return j.url;
}

function parseLatLng(t){ t=String(t||"");
  const m=t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||t.match(/[?&](?:q|query|ll)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||t.match(/^\s*(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)\s*$/);

      <label style="display:flex;gap:8px;align-items:center"><span class="switch"><input type="checkbox" id="bdel" ${b.delivery!==false?"checked":""}><span></span></span>توصيل</label>
      <label style="display:flex;gap:8px;align-items:center"><span class="switch"><input type="checkbox" id="bpick" ${b.pickup!==false?"checked":""}><span></span></span>استلام من الفرع</label>
      <label style="display:flex;gap:8px;align-items:center"><span class="switch"><input type="checkbox" id="bact" ${b.active!==false?"checked":""}><span></span></span>الفرع شغّال</label></div>
    ${isNew?"":`<div class="muted" style="font-size:12px">إيقاف الفرع يخفيه من الكاشير والتتبع ويقفل الطلب منه في المنيو — وتبقى تقاريره وطلباته القديمة محفوظة.</div>`}
    <div class="err" id="berr"></div>
    <div class="mact"><button class="btn ghost" data-x>إلغاء</button><button class="btn" id="bsave">💾 ${isNew?"إضافة الفرع":"حفظ"}</button></div>`);
  const showLoc=()=>{ const v=$("#bloc").value.trim(); const ll=parseLatLng(v); $("#blocs").textContent=!v?"":ll?`✓ ${ll.lat}, ${ll.lng}`:"ما قدرت أقرأ الإحداثيات — افتح الموقع في قوقل ماب واضغط مطولاً على الفرع وانسخ الأرقام"; };
  m.querySelector("#bloc").oninput=showLoc; showLoc();
  m.querySelector("#bgeo").onclick=()=>{ if(!navigator.geolocation) return toast("الجهاز ما يدعم تحديد الموقع");
    $("#blocs").textContent="جارِ تحديد موقعك…";
    navigator.geolocation.getCurrentPosition(p=>{ $("#bloc").value=p.coords.latitude.toFixed(6)+", "+p.coords.longitude.toFixed(6); showLoc(); },()=>{ $("#blocs").textContent="ما قدرت أحدد الموقع — الصق الرابط بدلها"; },{enableHighAccuracy:true,timeout:15000}); };
  m.querySelector("#bsave").onclick=async()=>{
    const pin=$("#bpin").value.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g,"");
    const locv=$("#bloc").value.trim(), ll=parseLatLng(locv);
    const p={id:b.id||"",name_ar:$("#bar").value.trim(),name_en:$("#ben").value.trim(),pin,whatsapp:$("#bwa").value.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g,""),address:$("#badr").value.trim(),
      open:$("#bopen").value,close:$("#bclose").value,radius:parseInt($("#brad").value)||50,delivery:$("#bdel").checked,pickup:$("#bpick").checked,active:$("#bact").checked};
    if(ll){p.lat=ll.lat;p.lng=ll.lng}
    const err=t=>{$("#berr").textContent=t};
    if(!p.name_ar) return err("اكتب اسم الفرع بالعربي");
    if(!/[a-z]/i.test(p.name_en)) return err("اكتب اسم الفرع بالإنجليزي (يُستخدم في الرابط والتتبع)");
    if(isNew&&!/^\d{4,8}$/.test(pin)) return err("اكتب رمز دخول من ٤ إلى ٨ أرقام");
    if(!isNew&&pin&&!/^\d{4,8}$/.test(pin)) return err("الرمز لازم ٤ إلى ٨ أرقام");
    if(locv&&!ll) return err("رابط الموقع غير مفهوم");
    if(!/^\d{2}:\d{2}$/.test(p.open)||!/^\d{2}:\d{2}$/.test(p.close)) return err("اكتب وقت الفتح والإغلاق");
    $("#bsave").disabled=true;
    try{
      const r=await rpc("pos_branch_save",{p_token:token,p:p});
      closeModal();
      toast(isNew?`تمت إضافة الفرع ✓ — رمز دخوله ${pin}`:"تم حفظ الفرع ✓");
      try{ const c=await rpc("pos_ctx",{p_token:token}); branches=c.branches||branches; settings=c.settings||settings; }catch(e){}
      pBranches();
      if(isNew) setTimeout(()=>branchDone(r,p),300);
    }catch(e){ const msg=String(e.message||""); err(/pin_taken/.test(msg)?"هذا الرمز مستخدم لفرع أو مستخدم ثاني — اختر رمز غيره":/pin_format/.test(msg)?"الرمز لازم ٤ إلى ٨ أرقام":"تعذّر الحفظ"); $("#bsave").disabled=false; }
  };
}
function branchDone(r,p){
  const track=`https://track.rqkitchen.app/b/${r.slug}`;
  modal(`<h3>✅ الفرع جاهز<button class="x" data-x>✕</button></h3>
    <div style="font-size:14px;line-height:1.9">
      <div>🧾 <b>الكاشير والجرد:</b> سجّل دخول برمز الفرع <b class="num">${esc(p.pin)}</b></div>
      <div>🛎 <b>تطبيق الفرع (استقبال طلبات المنيو):</b> نفس الرمز <b class="num">${esc(p.pin)}</b></div>
      <div>🍔 <b>المنيو وتطبيق الطلبات:</b> الفرع ظاهر للعملاء${p.whatsapp?"":" — <span style='color:var(--bad)'>ضيف رقم واتساب عشان توصله الطلبات</span>"}</div>
      <div>🕒 <b>الحضور:</b> ${p.lat!=null?"الفرع مضاف بموقعه ونطاق "+p.radius+" متر — اربط الموظفين فيه من إدارة الحضور":"<span style='color:var(--bad)'>ضيف موقع الفرع عشان يظهر في الحضور</span>"}</div>
      <div>📲 <b>التتبع:</b> <a href="${track}" target="_blank" rel="noopener" dir="ltr">${track}</a></div>
      <div>⏰ <b>الإغلاق التلقائي:</b> فعّله للفرع من صفحة «أوقات الفروع»</div>
    </div>
    <div class="mact"><button class="btn" data-x>تمام</button></div>`);
}

// ---------- BRANCH HOURS + AUTO CLOSE ----------
async function pHours(){
  let h={}; try{ h=JSON.parse(settings.hours||"{}")||{}; }catch(e){}
  const bs=branches.filter(b=>b.id!=="bdemo");
  bs.forEach(b=>{ h[b.id]=Object.assign({open:"15:00",close:"00:30",auto:false,close_at:"04:00"},h[b.id]||{}); });
  $("#main").innerHTML=`<div class="card">
    <h2>أوقات الفروع والإغلاق التلقائي<span class="sp"></span><button class="btn sm" id="hsave">💾 حفظ</button></h2>
    <div class="muted" style="font-size:12.5px;margin-bottom:12px">وقت الفتح والإغلاق يظهر للعملاء في المنيو الإلكتروني وتطبيق الطلبات. <b>الإغلاق التلقائي</b>: إذا الكاشير نسي يغلق اليوم، النظام يغلقه بروحه في الوقت اللي تحدده — يسلّم الطلبات المفتوحة ويحسب الكاش على المتوقع (بدون عدّ)، ويكتب في التقرير «إغلاق تلقائي».</div>
    <div class="scroll" style="max-height:none"><table><thead><tr><th>الفرع</th><th>يفتح</th><th>يقفل</th><th>إغلاق تلقائي للكاشير</th><th>الساعة</th></tr></thead><tbody>
    ${bs.map(b=>`<tr data-hb="${esc(b.id)}"><td><b>${esc(b.name)}</b></td>
      <td><input type="time" data-k="open" value="${esc(h[b.id].open)}"></td>
      <td><input type="time" data-k="close" value="${esc(h[b.id].close)}"></td>
      <td><label class="switch"><input type="checkbox" data-k="auto" ${h[b.id].auto?"checked":""}><span></span></label></td>
      <td><input type="time" data-k="close_at" value="${esc(h[b.id].close_at)}"></td></tr>`).join("")}
    </tbody></table></div>
    <div class="muted" style="font-size:12.5px;margin-top:10px">مثال: الفرع يقفل 12:30 بالليل، خلّ الإغلاق التلقائي 4:00 الفجر — لو الكاشير ما أغلق، يتقفل بروحه.</div></div>`;
  $("#hsave").onclick=async()=>{ const out={};
    document.querySelectorAll("[data-hb]").forEach(tr=>{ const g=k=>tr.querySelector(`[data-k="${k}"]`); out[tr.dataset.hb]={open:g("open").value,close:g("close").value,auto:g("auto").checked,close_at:g("close_at").value}; });
    if(Object.values(out).some(x=>!/^\d{2}:\d{2}$/.test(x.open)||!/^\d{2}:\d{2}$/.test(x.close)||!/^\d{2}:\d{2}$/.test(x.close_at))) return toast("اكتب كل الأوقات");
    try{ await rpc("pos_save_hours",{p_token:token,p_hours:out}); settings.hours=JSON.stringify(out); toast("تم حفظ الأوقات ✓"); }catch(e){ toast("تعذّر الحفظ"); } };
}

// ---------- DELIVERY APPS ----------
let editApps=null, editAppId=null;
async function pApps(){
  if(!menuData) menuData=await rpc("pos_menu_list",{p_token:token});
  if(!editApps) editApps=JSON.parse(JSON.stringify(apps));
  if(!editAppId&&editApps[0]) editAppId=editApps[0].id;
  const a=editApps.find(x=>x.id===editAppId);
  const items=(menuData.items||[]).filter(i=>i.active);
  $("#main").innerHTML=`<div class="card">
    <div class="toolbar"><div class="chips" id="atabs">${editApps.map(x=>`<button data-ap="${esc(x.id)}" class="${x.id===editAppId?"on":""}">${esc(x.name)}</button>`).join("")}<button data-ap="+">＋ تطبيق</button></div></div>
    ${a?`<div class="toolbar"><label class="muted">الاسم</label><input type="text" id="apn" value="${esc(a.name)}" style="width:170px">
      <label class="muted">زيادة على كل الأسعار %</label><input type="number" id="app" class="num" value="${+a.pct||0}" style="width:90px">
      <span class="sp"></span><button class="btn ghost sm" id="apdel">حذف التطبيق</button><button class="btn" id="apsave">💾 حفظ</button></div>
    <div class="muted" style="font-size:12.5px;margin-bottom:8px">لما الكاشير يختار هذا التطبيق تتحول الأسعار لأسعاره، وطريقة الدفع تصير باسمه. الخانة الفاضية = سعر المحل + النسبة.</div>
    <div class="scroll" style="max-height:none"><table><thead><tr><th>الصنف</th><th>سعر المحل</th><th>سعر التطبيق</th></tr></thead><tbody>
    ${items.map(i=>{const def=+(i.price*(1+(+a.pct||0)/100)).toFixed(2), ov=(a.prices||{})[i.id];return `<tr><td>${esc(i.name)}</td><td class="num">${money(i.price)}</td><td><input class="pricein num" type="number" step="0.5" data-pi="${i.id}" value="${ov!=null?ov:""}" placeholder="${money(def)}"></td></tr>`}).join("")}
    </tbody></table></div>`:`<div class="empty">أضف تطبيق توصيل</div>`}</div>`;
  $("#atabs").onclick=e=>{const b=e.target.closest("[data-ap]"); if(!b) return;
    if(b.dataset.ap==="+"){const id="app"+Math.random().toString(36).slice(2,8); editApps.push({id,name:"تطبيق جديد",pct:0,prices:{}}); editAppId=id}else editAppId=b.dataset.ap; pApps()};
  if(!a) return;
  a.prices=a.prices||{};
  $("#apn").oninput=e=>a.name=e.target.value;
  $("#app").oninput=e=>{a.pct=parseFloat(e.target.value)||0; document.querySelectorAll("[data-pi]").forEach(inp=>{const it=items.find(i=>i.id===inp.dataset.pi); if(it) inp.placeholder=money(it.price*(1+a.pct/100))})};
  $("#main").addEventListener("input",e=>{const inp=e.target.closest("[data-pi]"); if(!inp) return; const v=inp.value.trim(); if(v===""||isNaN(+v)) delete a.prices[inp.dataset.pi]; else a.prices[inp.dataset.pi]=+v});
  $("#apdel").onclick=()=>{ if(!confirmInline("#apdel","تأكيد الحذف؟")) return; editApps=editApps.filter(x=>x!==a); editAppId=editApps[0]&&editApps[0].id; saveApps() };
  $("#apsave").onclick=saveApps;
}
function confirmInline(sel,txt){const b=$(sel); if(b.dataset.ok){return true} b.dataset.ok=1; b.textContent=txt; b.classList.add("red"); b.style.color="#fff"; setTimeout(()=>{if(b.isConnected){delete b.dataset.ok;b.textContent="حذف التطبيق";b.classList.remove("red");b.style.color=""}},3000); return false}
async function saveApps(){
  const clean=editApps.filter(a=>a.name&&a.name.trim()).map(a=>({id:a.id,name:a.name.trim(),pct:+a.pct||0,prices:a.prices||{}}));
  try{ await rpc("pos_save_apps",{p_token:token,p_apps:clean}); apps=clean; settings.apps=JSON.stringify(clean); editApps=JSON.parse(JSON.stringify(clean)); toast("تم حفظ أسعار التطبيقات ✓"); pApps(); }
  catch(e){ toast("تعذّر الحفظ"); }
}

// ---------- CASHIERS ----------
async function pCashiers(){
  const list=(await rpc("pos_cashiers_list",{p_token:token})||[]).filter(c=>c.branch_id!=="bdemo");
  $("#main").innerHTML=`<div class="card">
    <h2>إضافة كاشير</h2>
    <div class="toolbar"><input type="text" id="cn" placeholder="اسم الكاشير" style="flex:1;min-width:160px"><input type="password" id="cp" class="num" inputmode="numeric" maxlength="8" placeholder="الرقم السري (٤–٨ أرقام)" style="width:200px"><button class="btn" id="cadd">＋ إضافة</button></div>
    <div class="err" id="cerr"></div>
    <div class="muted" style="font-size:12.5px;margin-bottom:10px">كل كاشير يقدر يسجّل في أي فرع: يختار الفرع ثم رقمه السري. الرقم السري لازم يكون مختلف لكل كاشير.</div>
    <table id="ctb"></table></div>`;
  table($("#ctb"),["الكاشير","الحالة",""],list.map(c=>[`👤 <b>${esc(c.name)}</b>`,`<span class="pill ${c.active?"on":"off"}">${c.active?"فعّال":"موقوف"}</span>`,`<button class="btn ghost sm" data-ce="${c.id}">تعديل</button>`]),{empty:"لا يوجد كاشير — أضف من فوق"});
  const err=t=>$("#cerr").textContent=t;
  const msg=e=>/pin_taken/.test(e.message)?"الرقم السري مستخدم لكاشير ثاني":/pin_format/.test(e.message)?"الرقم السري من ٤ إلى ٨ أرقام":/name/.test(e.message)?"اكتب الاسم":"تعذّر الحفظ";
  $("#cadd").onclick=async()=>{ const n=$("#cn").value.trim(), p=$("#cp").value.replace(/\D/g,""); if(!n) return err("اكتب الاسم"); if(p.length<4) return err("الرقم السري من ٤ إلى ٨ أرقام");
    try{ await rpc("pos_cashier_save",{p_token:token,p_id:null,p_branch:"all",p_name:n,p_pin:p,p_active:true}); toast("تمت إضافة "+n+" ✓"); pCashiers(); }catch(e){ err(msg(e)); } };
  $("#ctb").onclick=e=>{ const b=e.target.closest("[data-ce]"); if(!b) return; const c=list.find(x=>x.id===b.dataset.ce);
    const m=modal(`<h3>تعديل ${esc(c.name)}<button class="x" data-x>✕</button></h3>
      <div class="fld"><label>الاسم</label><input id="en" value="${esc(c.name)}"></div>
      <div class="fld"><label>رقم سري جديد (اتركه فاضي إذا ما تبي تغيّره)</label><input id="ep" class="num" type="password" inputmode="numeric" maxlength="8"></div>
      <label style="display:flex;gap:8px;align-items:center"><span class="switch"><input type="checkbox" id="ea" ${c.active?"checked":""}><span></span></span>فعّال (الموقوف ما يقدر يدخل)</label>
      <div class="err" id="eerr"></div><div class="mact"><button class="btn ghost" data-x>إلغاء</button><button class="btn" id="esave">💾 حفظ</button></div>`);
    m.querySelector("#esave").onclick=async()=>{ const p=$("#ep").value.replace(/\D/g,""); if(p&&p.length<4){$("#eerr").textContent="الرقم السري من ٤ إلى ٨ أرقام";return}
      try{ await rpc("pos_cashier_save",{p_token:token,p_id:c.id,p_branch:"all",p_name:$("#en").value.trim(),p_pin:p||null,p_active:$("#ea").checked}); closeModal(); toast("تم الحفظ ✓"); pCashiers(); }catch(e){ $("#eerr").textContent=msg(e); } };
  };
}

// ---------- SETTINGS ----------
async function pSettings(){
  const admin=isAdmin();
  $("#main").innerHTML=`<div class="grid half">
    <div class="card"><h2>الفاتورة</h2>
      <div class="fld"><label>الرقم الضريبي (TRN)</label><input id="strn" class="num" value="${esc(settings.trn||"")}" ${admin?"":"disabled"}></div>
      <div class="fld"><label>النص أسفل الفاتورة</label><textarea id="sfoot" rows="2" ${admin?"":"disabled"}>${esc(settings.footer||"")}</textarea></div>
      ${admin?`<div class="mact"><button class="btn" id="ssave">💾 حفظ</button></div>`:""}</div>
    <div class="card"><h2>روابط سريعة</h2>
      <div style="display:flex;flex-direction:column;gap:8px">
        <a class="btn ghost" href="${CASHIER}" target="_blank">🧾 تطبيق الكاشير</a>
        <a class="btn ghost" href="https://inventory.rqkitchen.app/" target="_blank">📦 تطبيق الجرد</a>
        <a class="btn ghost" href="https://track.rqkitchen.app/" target="_blank">🔔 صفحة تتبع الطلبات</a>
        <a class="btn ghost" href="https://apps.rqkitchen.app/" target="_blank">⬇ تحميل تطبيقات الموظفين</a>
        <a class="btn ghost" href="https://owner.rqkitchen.app/" target="_blank">📊 تطبيق المالك</a>
      </div>
      <div class="muted" style="font-size:12.5px;margin-top:12px">الطابعة وإعدادات الجهاز تُضبط من داخل تطبيق الكاشير في كل فرع.</div></div>
    ${admin?`<div class="card"><h2>📊 تطبيق المالك</h2>
      <div class="muted" style="font-size:13px;margin-bottom:10px">رقم سري للمالك يفتح فيه <b>owner.rqkitchen.app</b> ويشوف كل المبيعات والمنتجات والأيام لكل الفروع — <b>مشاهدة فقط</b>، ما يقدر يغيّر شي. (رقم المدير يفتح التطبيق بعد.)</div>
      <div class="fld"><label>رقم سري جديد للمالك (٦–٨ أرقام)</label><input id="opin" class="num" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••••"></div>
      <div class="err" id="operr"></div>
      <div class="mact"><button class="btn" id="opsave">🔐 حفظ رقم المالك</button></div>
      <div class="muted" style="font-size:12px;margin-top:8px">تغيير الرقم يسجّل خروج المالك من كل الأجهزة.</div></div>`:""}
  </div>`;
  if(admin) $("#opsave").onclick=async()=>{ const v=$("#opin").value.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g,""); $("#operr").textContent="";
    if(!/^\d{6,8}$/.test(v)) return $("#operr").textContent="الرقم لازم ٦ إلى ٨ أرقام";
    try{ await rpc("pos_set_owner_pin",{p_token:token,p_pin:v}); $("#opin").value=""; toast("تم حفظ رقم المالك ✓"); }
    catch(e){ $("#operr").textContent=/pin_taken/.test(e.message)?"هذا الرقم مستخدم لفرع أو كاشير أو للمدير — اختر غيره":"تعذّر الحفظ"; } };
  if(admin) $("#ssave").onclick=async()=>{ try{ await rpc("pos_save_settings",{p_token:token,p_trn:$("#strn").value.trim(),p_footer:$("#sfoot").value.trim()}); settings.trn=$("#strn").value.trim(); settings.footer=$("#sfoot").value.trim(); toast("تم الحفظ ✓"); }catch(e){ toast("تعذّر الحفظ"); } };
}

// ---------- boot ----------
try{ const h=location.hash, m=h.match(/[#&?]t=([0-9a-f]{20,})/), pg=(h.match(/[#&?]p=([a-z]+)/)||[])[1];
  if(m){ token=m[1]; LS.set("con.token",token); }
  if(m||pg) history.replaceState(null,"",location.pathname+"#"+(pg||"home")); }catch(e){}
if("serviceWorker" in navigator && !window.RQ_NATIVE && /^console\./.test(location.hostname)) navigator.serviceWorker.register("/console-sw.js",{scope:"/"}).catch(()=>{});
if(token) start(); else setTimeout(()=>$("#pin").focus(),50);
</script>
</body>
