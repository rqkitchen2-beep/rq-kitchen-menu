<style>
:root{
  --bg:#EFE9E3; --card:#FFFFFF; --surface:#F5EFE9; --line:#E2D7CC; --ink:#1C1410; --muted:#6A5A50;
  --brand:#F29835; --brand-ink:#14100D; --brand-text:#A84F07; --disc:#FDE7CB;
  --ok:#17803F; --ok-bg:#E2F3E8; --danger:#B42318; --danger-bg:#FDECEA; --blue:#1F5FBF; --blue-bg:#E6EEFB;
  --display:'Bricolage Grotesque','Arial Black',system-ui,sans-serif; --ar:'Alexandria','Geeza Pro','Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F0D0C;--card:#1C1815;--surface:#26201C;--line:#3A2F27;--ink:#FFF4E6;--muted:#C9BBAE;--brand-text:#F7B060;--disc:#3A2A1A;--ok-bg:#133222;--danger-bg:#3A1714;--blue-bg:#16243D;--blue:#8DB4F5}}
:root[data-theme="dark"]{--bg:#0F0D0C;--card:#1C1815;--surface:#26201C;--line:#3A2F27;--ink:#FFF4E6;--muted:#C9BBAE;--brand-text:#F7B060;--disc:#3A2A1A;--ok-bg:#133222;--danger-bg:#3A1714;--blue-bg:#16243D;--blue:#8DB4F5}
*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ar);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:10px}
[hidden]{display:none !important}
.lat{font-family:var(--display);direction:ltr;unicode-bidi:isolate}

/* login */
.login{max-width:440px;margin:0 auto;padding:calc(36px + env(safe-area-inset-top,0px)) 22px 30px}
.login .badge{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.login .badge img{width:84px;background:#fff;border-radius:16px;padding:6px 10px}
.login .badge b{display:block;font-size:22px;font-weight:800}
.login .badge span{color:var(--muted);font-size:14px}
.lbl{display:block;font-weight:700;font-size:14px;margin:0 0 8px}
.brgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.brgrid label{display:block}
.brgrid input{position:absolute;opacity:0;pointer-events:none}
.brgrid span{display:block;text-align:center;padding:14px 8px;border:2px solid var(--line);border-radius:14px;font-weight:700;background:var(--card)}
.brgrid input:checked+span{border-color:var(--brand);background:var(--disc)}
.brgrid input:focus-visible+span{outline:3px solid var(--brand);outline-offset:2px}
.f{display:block;width:100%;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-size:16px}
.f:focus{border-color:var(--brand);outline:none}
.pin{font-family:var(--display);letter-spacing:10px;text-align:center;font-size:22px}
.err{color:var(--danger);font-size:14px;margin-top:8px;min-height:20px}

.btn{appearance:none;border:0;border-radius:14px;padding:12px 16px;font-weight:800;font-size:15px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.block{width:100%}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.ok{background:var(--ok);color:#fff}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.blue{background:var(--blue-bg);color:var(--blue)}
.btn.danger{background:transparent;color:var(--danger);border:2px solid currentColor}
.btn.sm{min-height:40px;padding:8px 12px;font-size:13.5px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:#1C1410;color:#FFF4E6;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top img{width:52px;background:#fff;border-radius:10px;padding:3px 6px}

.top .t small{display:block;font-size:12.5px;opacity:.8}
.top .clock{font-family:var(--display);font-size:20px;direction:ltr}
.tbtn{appearance:none;border:0;background:rgba(255,255,255,.1);color:inherit;border-radius:12px;padding:9px 12px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;min-height:40px}

@media (prefers-reduced-motion:reduce){.tbtn.warn{animation:none}}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;opacity:.85}
.live i{width:8px;height:8px;border-radius:50%;background:#2FB45F}
.live.off i{background:#F05A4A}

/* board */
.tabs{display:none;gap:6px;padding:10px 12px 0}
.tabs button{flex:1;appearance:none;border:0;background:var(--card);border-radius:12px;padding:10px 6px;font-weight:800;color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.n{background:var(--brand);color:var(--brand-ink);font-family:var(--display);min-width:22px;height:22px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;padding:0 6px}

@media (max-width:899px){.tabs{display:flex}.board{grid-template-columns:1fr}.col{display:none}.col.on{display:block}.col h2{display:none}}

.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(28,20,16,.06);border-top:6px solid var(--line)}
.card.st-new{border-top-color:var(--brand)}
.card.st-new.late{border-top-color:var(--danger);box-shadow:0 0 0 3px var(--danger)}
.card.st-accepted,.card.st-preparing{border-top-color:#C9A227}
.card.st-ready{border-top-color:var(--ok)}
.card.st-on_way{border-top-color:var(--blue)}

.ch{display:flex;align-items:center;justify-content:space-between;gap:8px}

.ago{font-size:13px;color:var(--muted);font-weight:600}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;border-radius:99px;padding:4px 10px;white-space:nowrap}
.pill.del{background:var(--blue-bg);color:var(--blue)}
.pill.pick{background:var(--disc);color:var(--brand-text)}
.pill.cash{background:var(--ok-bg);color:var(--ok)}

.items{list-style:none;margin:0 0 10px;padding:10px 12px;background:var(--surface);border-radius:14px}

.items .nt{display:block;font-size:13px;color:var(--danger);font-weight:700;text-align:right;direction:rtl}
.note{background:var(--disc);color:var(--brand-text);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600;margin-bottom:10px}
.cust{font-size:14px;margin-bottom:10px;display:flex;flex-direction:column;gap:2px}
.cust b{font-size:15px}

.tot{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:12px}
.tot b{font-family:var(--display);font-size:20px;direction:ltr}
.drv{display:flex;align-items:center;gap:10px;background:var(--blue-bg);color:var(--blue);border-radius:12px;padding:8px 12px;font-size:13.5px;font-weight:700;margin-bottom:10px}

.acts{display:grid;gap:8px}
.acts.two{grid-template-columns:1fr 1fr}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.eta{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.eta label{flex:1;min-width:60px}
.eta input{position:absolute;opacity:0;pointer-events:none}
.eta span{display:block;text-align:center;padding:8px 4px;border:2px solid var(--line);border-radius:10px;font-weight:700;font-size:13.5px}
.eta input:checked+span{border-color:var(--brand);background:var(--disc)}
.eta input:focus-visible+span{outline:3px solid var(--brand);outline-offset:2px}
.hist{padding:0 12px 30px}
.hist summary{cursor:pointer;font-weight:800;padding:12px 4px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.sum div{background:var(--card);border-radius:14px;padding:10px 14px}
.sum span{display:block;font-size:12.5px;color:var(--muted)}
.sum b{font-family:var(--display);font-size:20px;direction:ltr;display:block;text-align:right}

.modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(20,16,14,.55);padding:16px}
.modal.open{display:flex}

.reasons{display:grid;gap:8px;margin-bottom:12px}
.reasons label{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;cursor:pointer}
.reasons input{accent-color:var(--brand);width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 40px)}
.toast.show{opacity:1}
.demo{background:var(--brand);color:var(--brand-ink);font-size:12.5px;text-align:center;padding:6px 12px;font-weight:600}



/* phone-first header like delivery-app merchant tablets */
.top{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px 12px}
.top .t{min-width:0}
.top .clock{display:none}
@media (min-width:600px){.top{grid-template-columns:auto 1fr auto auto auto}.top .clock{display:block}}
#sound:not(.warn){display:none}
.top #sound{grid-column:1/-1;justify-content:center;order:5}
.tbtn.gear{width:44px;justify-content:center;padding:0}
.onsw{grid-column:1/-1;appearance:none;border:0;display:flex;align-items:center;gap:12px;background:rgba(47,180,95,.16);color:inherit;border-radius:16px;padding:10px 14px;text-align:start;font:inherit}
.onsw .sw{width:52px;height:30px;border-radius:99px;background:#2FB45F;position:relative;flex:none;transition:background .2s}
.onsw .sw i{position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
html[dir=rtl] .onsw .sw i{transform:translateX(-22px)}html[dir=ltr] .onsw .sw i{transform:translateX(22px)}
.onsw .lb b{display:block;font-size:16px}.onsw .lb small{display:block;font-size:12.5px;opacity:.75}

.onsw.paused .sw{background:#7A6A60}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 12px 0}

.stats span{display:block;font-size:12px;color:var(--muted);font-weight:600}

.sheet{position:fixed;inset:0;z-index:75;display:none;align-items:flex-end;justify-content:center;background:rgba(20,16,14,.55)}

.srow b{color:var(--brand-text,#C2610F)}
.srow.danger{color:var(--danger)}

.stats button{appearance:none;border:0;font:inherit;color:inherit;text-align:start;background:var(--card);border-radius:16px;padding:10px 12px;box-shadow:0 2px 10px rgba(28,20,16,.05)}
.stats button span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.stats button b{display:block;font-family:var(--display);font-size:22px;margin-top:2px;direction:ltr;text-align:start}
.replink{padding:6px 12px 0}
.replink button{appearance:none;border:0;background:none;color:var(--brand-text,#C2610F);font:inherit;font-weight:700;font-size:13.5px;padding:6px 2px}
.sheet .rp{max-height:92vh;overflow:auto}
.rseg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.rseg::-webkit-scrollbar{display:none}
.rseg button{appearance:none;border:0;flex:none;background:var(--surface);color:var(--ink);border-radius:99px;padding:9px 14px;font:inherit;font-weight:700;font-size:14px}

.rcus{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end;margin-top:10px}.rcus .btn{grid-column:1/-1}
.rcus[hidden]{display:none}
.rcus label span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}

.rbig b{display:block;font-family:var(--display);font-size:38px;direction:ltr;text-align:start}
.rbig em{font-style:normal;font-size:13px;opacity:.8}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.rgrid div{background:var(--surface);border-radius:14px;padding:10px 12px}
.rgrid span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.rgrid b{display:block;font-family:var(--display);font-size:19px;direction:ltr;text-align:start}
.rsec{margin:16px 0 6px;font-size:15px;font-weight:800}

/* incoming order (delivery-app style) */
.inc{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;background:#1C1410;color:#FFF4E6;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));overflow:auto}

    out.forEach(function(l){x.fillText(l,px,y);y+=Math.round(s*1.3);});}
  function rule(){y+=4;x.fillRect(pad,y,W-pad*2,2);y+=8;}
  function row(l,r,s,b){font(s,b);x.direction='ltr';x.textAlign='left';x.fillText(l,pad,y);x.textAlign='right';x.fillText(r,W-pad,y);y+=Math.round(s*1.35);}
  var a=o.address;
  line('RQ Kitchen',30,true);line('فرع '+branchName(AUTH.b),20);rule();
  line('#'+o.order_no,52,true,'center','ltr');line((o.kind==='delivery'?'توصيل':'استلام من الفرع')+' · '+hhmm(o.created_at),20,true);
  if(o.eta_minutes)line('التجهيز: '+o.eta_minutes+' دقيقة',20);rule();
  o.items.forEach(function(i){font(22,true);x.direction='ltr';x.textAlign='left';var q=i.qty+'x ';x.fillText(q,pad,y);var qw=x.measureText(q).width;font(22,true);
    var nm=i.name,maxw=W-pad*2-qw-90;while(x.measureText(nm).width>maxw&&nm.length>4)nm=nm.slice(0,-2);x.fillText(nm===i.name?nm:nm+'…',pad+qw,y);x.textAlign='right';font(20);x.fillText(money(i.price*i.qty),W-pad,y);y+=30;
    if(i.note){line('* '+i.note,20,true,'right');}});
  rule();
  if(o.notes){line('ملاحظة: '+o.notes,20,true,'right');rule();}
  line(o.name||'',22,true,'right');line('+'+String(o.phone||'').replace(/\D/g,''),20,false,'right','ltr');
  if(a)line((a.area||'')+(a.details?' · '+a.details:''),20,false,'right');rule();
  if(o.delivery_fee>0)row('Delivery',money(o.delivery_fee),20);
  if(Number(o.discount)>0)row('Discount '+(o.coupon_code||''),'-'+money(o.discount),20);
  row('TOTAL',money(o.total)+' AED',28,true);
  line(o.payment==='cash'?'الدفع: كاش':'الدفع: بطاقة عند الاستلام',22,true);y+=40;
  var out=document.createElement('canvas');out.width=W;out.height=y;out.getContext('2d').drawImage(c,0,0);return out.toDataURL('image/png').split(',')[1];}

/* ---------- settings sheet, stats, waiting screen ---------- */
$('#menuBtn').onclick=function(){$('#menu').classList.add('open');checkPrinter();};
$('#menuX').onclick=function(){$('#menu').classList.remove('open');};
$('#menu').addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});
$('#tprint').onclick=function(){var o={id:'test',order_no:'TEST',kind:'delivery',created_at:new Date().toISOString(),eta_minutes:20,items:[{name:'Double Wagyu Burger',qty:1,price:63,note:'بدون بصل'},{name:'Classic Fries',qty:2,price:21}],notes:'إيصال تجريبي',name:'RQ',phone:'971500000000',address:{area:'Test',details:''},delivery_fee:10,discount:0,total:115,payment:'cash'};
  var NP=nativePrinter();if(NP&&PRN){NP.printBitmap({data:receiptImage(o,PRN.width||384)}).then(function(){toast('طبعنا إيصال تجريبي');}).catch(function(e){toast('تعذرت الطباعة: '+((e&&e.message)||''));});}else toast('ما لقينا طابعة داخلية في هالجهاز');};
function renderStats(){var done=HIST.filter(function(o){return o.status==='delivered'||o.status==='picked_up';});
  $('#stN').textContent=done.length;$('#stS').textContent=money(done.reduce(function(a,o){return a+Number(o.total||0);},0));
  $('#stA').textContent=ACTIVE.filter(function(o){return o.status!=='new';}).length;}
function paintEmpty(){var e=document.querySelector('#l-new .radar');if(!e)return;var b=curBranch(),off=!!(b&&b.manual_closed);e.classList.toggle('off',off);
  e.querySelector('b').textContent=off?'استقبال الطلبات موقوف':'بانتظار الطلبات';e.querySelector('p').textContent=off?'شغّل استقبال الطلبات من فوق عشان توصلك الطلبات':'أول ما يوصل طلب بتطلع شاشة الطلب وتسمع الصفارة';}
setInterval(function(){if(AUTH&&!$('#appV').hidden)loadHist();},60000);

/* ---------- sales report (today / yesterday / ranges) ---------- */
function dubaiDay(off){var d=new Date(Date.now()+(off||0)*864e5);return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dubai',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);}
function rangeOf(k){var t=dubaiDay(0);if(k==='today')return[t,t];if(k==='yday'){var y=dubaiDay(-1);return[y,y];}if(k==='7d')return[dubaiDay(-6),t];if(k==='month')return[t.slice(0,8)+'01',t];return null;}
function dayLbl(s){try{return new Intl.DateTimeFormat(window.RQLANG==='en'?'en-AE':'ar-AE',{weekday:'short',day:'numeric',month:'numeric',timeZone:'UTC'}).format(new Date(s+'T00:00:00Z'));}catch(e){return s;}}
var repKey='today';
function openRep(k){repKey=k||'today';$('#menu').classList.remove('open');$('#rep').classList.add('open');paintRepSeg();if(repKey==='custom'){$('#rcus').hidden=false;}else{$('#rcus').hidden=true;var r=rangeOf(repKey);loadRep(r[0],r[1]);}}
function paintRepSeg(){document.querySelectorAll('#rep [data-r]').forEach(function(b){b.setAttribute('aria-selected',b.dataset.r===repKey);});}
document.addEventListener('click',function(e){var r=e.target.closest('[data-rep]');if(r){openRep(r.dataset.rep);return;}var g=e.target.closest('[data-col-go]');if(g){var tb=document.querySelector('[data-col="'+g.dataset.colGo+'"]');if(tb)tb.click();}});
document.querySelectorAll('#rep [data-r]').forEach(function(b){b.onclick=function(){openRep(b.dataset.r);if(b.dataset.r==='custom'){var i1=$('#rd1'),i2=$('#rd2');if(!i1.value){i1.value=dubaiDay(-7);i2.value=dubaiDay(0);}i1.max=i2.max=dubaiDay(0);$('#rbody').innerHTML='';}};});
$('#rcus').onsubmit=function(e){e.preventDefault();var a=$('#rd1').value,b=$('#rd2').value;if(!a||!b)return;if(b<a){var x=a;a=b;b=x;}loadRep(a,b);};
$('#repX').onclick=function(){$('#rep').classList.remove('open');};
$('#rep').addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});
function loadRep(d1,d2){var B=$('#rbody');B.innerHTML='<p class="rempty">نجيب الأرقام…</p>';
  rpc('app_staff_report',{bid:AUTH.b,p:AUTH.p,d1:d1,d2:d2}).then(function(r){
    if(!r||!r.ok){B.innerHTML='<p class="rempty">'+esc(r&&r.error==='bad_range'?'اختر فترة أقصاها ٣ شهور':emsg(r&&r.error))+'</p>';return;}
    var s=r.summary||{},days=r.by_day||[],items=r.top_items||[];
    var h='<div class="rbig"><small>'+(d1===d2?dayLbl(d1):dayLbl(d1)+' – '+dayLbl(d2))+'</small><b>'+money(s.sales)+' AED</b><em>'+s.completed+' طلب مكتمل · متوسط الطلب '+money(s.avg_ticket)+' AED</em></div>'+
      '<div class="rgrid"><div><span>كاش</span><b>'+money(s.cash)+'</b></div><div><span>بطاقة</span><b>'+money(s.card)+'</b></div><div><span>توصيل</span><b>'+s.delivery+'</b></div><div><span>استلام</span><b>'+s.pickup+'</b></div><div><span>ملغية ومرفوضة</span><b>'+s.cancelled+'</b></div><div><span>خصومات الكوبونات</span><b>'+money(s.discounts)+'</b></div></div>';
    if(d1!==d2&&days.length){var mx=Math.max.apply(null,days.map(function(d){return Number(d.sales)||0;}).concat([1]));
      h+='<div class="rsec">حسب اليوم</div>'+days.map(function(d){return '<div class="rday"><span>'+dayLbl(d.day)+'</span><i style="width:'+Math.round((Number(d.sales)||0)/mx*100)+'%"></i><b>'+money(d.sales)+'</b></div>';}).join('');}
    h+='<div class="rsec">الأكثر مبيعاً</div>'+(items.length?items.map(function(i){return '<div class="ritem"><span>'+esc(i.name)+'</span><b>'+i.qty+'× · '+money(i.revenue)+'</b></div>';}).join(''):'<p class="rempty">ما فيه مبيعات في هالفترة</p>');
    B.innerHTML=h;}).catch(function(){B.innerHTML='<p class="rempty">'+ERR.net+'</p>';});}
/* ---------- load ---------- */
var busy=false;
function load(){if(!AUTH||busy)return Promise.resolve();busy=true;
  return rpc('app_staff_orders',{branch_id:AUTH.b,p:AUTH.p,scope:'active'}).then(function(r){
    if(!r||!r.ok){if(r&&(r.error==='bad_pin'||r.error==='locked'||r.error==='no_branch')){AUTH=null;store.del('rqb-auth');showLogin();toast(emsg(r.error));}return;}
    lastOk=Date.now();setLive(true);
    var ids=r.orders.filter(function(o){return o.status==='new';}).map(function(o){return o.id;});
    if(known){var fresh=ids.filter(function(id){return known.indexOf(id)<0;});if(fresh.length){toast(fresh.length===1?'طلب جديد!':fresh.length+' طلبات جديدة!');if(!soundOn)$('#sound').classList.add('warn');}}
    known=r.orders.map(function(o){return o.id;});
    ACTIVE=r.orders;render();incShow();
    if(ids.length)startRing();else stopRing();
  }).catch(function(){setLive(false);}).finally(function(){busy=false;});}
function loadHist(){if(!AUTH)return;rpc('app_staff_orders',{branch_id:AUTH.b,p:AUTH.p,scope:'today'}).then(function(r){if(r&&r.ok){HIST=r.orders;renderHist();renderStats();}}).catch(function(){});}
$('#hist').addEventListener('toggle',function(){if(this.open)loadHist();});
function setLive(ok){var l=$('#live');l.classList.toggle('off',!ok);$('#liveT').textContent=ok?'متصل':'غير متصل، نحاول نرجع';}
setInterval(function(){if(Date.now()-lastOk>20000)setLive(false);},5000);

function start(){$('#loginV').hidden=true;$('#appV').hidden=false;if(window.RQPush&&AUTH)RQPush.register(function(tk){if(AUTH)rpc('app_branch_push_register',{bid:AUTH.b,p:AUTH.p,token:tk}).then(function(){return rpc('app_push_lang',{token:tk,lang:window.RQLANG||'ar'});}).catch(function(){});});var b=BR.find(function(x){return x.id===AUTH.b;});
  $('#bName').textContent='فرع '+branchName(AUTH.b);$('#bOpen').textContent=b?(isOpen(b)?'الفرع مفتوح لين '+fmtT(b.close_time):'الفرع مغلق في التطبيق'):'';
  if(soundOn){$('#sound').classList.remove('warn');$('#sound').textContent='الصوت شغّال';}
  paintPause();checkPrinter();paintAP();
  loadHist();
  load();}
setInterval(function(){if(AUTH&&!$('#appV').hidden)load();},5000);
setInterval(function(){if(AUTH&&!$('#appV').hidden){render();if($('#hist').open)loadHist();}},30000);
setInterval(tick,10000);tick();

function boot(){rest('menu_branches?select=id,name_ar,sort,open_time,close_time,manual_closed&order=sort').then(function(b){BR=b;if(AUTH&&BR.some(function(x){return x.id===AUTH.b;}))start();else showLogin();}).catch(function(){
  if(preview){DEMO=true;demoInit();$('#demo').hidden=false;BR=DB.branches;showLogin();return;}
  document.body.insertAdjacentHTML('afterbegin','<div class="login"><h2>تعذّر الاتصال</h2><p>تأكد من الإنترنت.</p><button class="btn pri" onclick="location.reload()">إعادة المحاولة</button></div>');});}
boot();
})();
</script>
