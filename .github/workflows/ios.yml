name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-build
  cancel-in-progress: true

permissions:
  contents: write

env:
  ASC_KEY_ID: UC2RA225DB
  ASC_ISSUER: b8b36c2c-fdf9-40d8-a572-a8c2f019f780

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      team: ${{ steps.reg.outputs.team }}
      matrix: ${{ steps.reg.outputs.matrix }}
      cert: ${{ steps.cert.outputs.cert }}
    steps:
      - uses: actions/checkout@v4
      - name: Register bundle IDs
        id: reg
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/st"
          ST="$RUNNER_TEMP/st/setup.txt"
          echo "run: $GITHUB_RUN_NUMBER  $(date -u)" > "$ST"
          if [ -z "$ASC_KEY" ]; then echo "ERROR: secret ASC_KEY missing" | tee -a "$ST"; exit 1; fi
          printf '%s\n' "$ASC_KEY" > "$RUNNER_TEMP/key.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/key.p8"
          pip install -q pyjwt cryptography
          T1=$(python3 native/scripts/asc.py ensure-bundle com.rqkitchen.app "RQ Kitchen" 2>>"$ST")
          T2=$(python3 native/scripts/asc.py ensure-bundle com.rqkitchen.driver "RQ Driver" 2>>"$ST")
          python3 native/scripts/asc.py ensure-bundle com.rqkitchen.branch "RQ Branch" >/dev/null 2>>"$ST"
          python3 native/scripts/asc.py ensure-bundle com.rqkitchen.cashier "RQ Cashier" >/dev/null 2>>"$ST"
          python3 native/scripts/asc.py ensure-bundle com.rqkitchen.attendance "RQ Attendance" >/dev/null 2>>"$ST"
          python3 native/scripts/asc.py ensure-bundle com.rqkitchen.inventory "RQ Inventory" >/dev/null 2>>"$ST"
          echo "team: $T1 / $T2" >> "$ST"
          A1=$(python3 native/scripts/asc.py find-app com.rqkitchen.app)
          A2=$(python3 native/scripts/asc.py find-app com.rqkitchen.driver)
          echo "app_customer: ${A1:-MISSING}" >> "$ST"
          echo "app_driver: ${A2:-MISSING}" >> "$ST"
          A3=$(python3 native/scripts/asc.py find-app com.rqkitchen.branch)
          echo "app_branch: ${A3:-MISSING}" >> "$ST"
          A4=$(python3 native/scripts/asc.py find-app com.rqkitchen.cashier)
          echo "app_cashier: ${A4:-MISSING}" >> "$ST"
          A5=$(python3 native/scripts/asc.py find-app com.rqkitchen.attendance)
          echo "app_attendance: ${A5:-MISSING}" >> "$ST"
          A6=$(python3 native/scripts/asc.py find-app com.rqkitchen.inventory)
          echo "app_inventory: ${A6:-MISSING}" >> "$ST"
          REQ=$(cat native/build-request.txt)
          M="[]"
          L=""
          for a in $REQ; do
            if [ "$a" = customer ]; then L="$L\"customer\","; fi
            if [ "$a" = driver ]; then L="$L\"driver\","; fi
            if [ "$a" = branch ]; then L="$L\"branch\","; fi
            if [ "$a" = cashier ]; then
              if [ -n "$A4" ]; then L="$L\"cashier\","; else echo "cashier: create the app in App Store Connect first (bundle com.rqkitchen.cashier)" >> "$ST"; fi
            fi
          done
          [ -n "$L" ] && M="[${L%,}]"
          echo "matrix: $M" >> "$ST"
          echo "team=$T1" >> "$GITHUB_OUTPUT"
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
      - name: Apple Pay setup
        continue-on-error: true
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/key.p8"
          { echo "---- apple pay ----"; python3 native/scripts/applepay.py 2>&1; } >> "$RUNNER_TEMP/st/setup.txt"
      - name: Distribution certificate
        id: cert
        if: steps.reg.outputs.matrix != '[]'
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
        run: |
          set -e
          export ASC_KEY_PATH="$RUNNER_TEMP/key.p8"
          P=$(printf '%s' "$ASC_KEY" | sha256sum | cut -c1-40)
          CID=$(python3 native/scripts/signing.py make-cert "$RUNNER_TEMP/cert" "$P" 2>>"$RUNNER_TEMP/st/setup.txt")
          echo "cert: $CID" >> "$RUNNER_TEMP/st/setup.txt"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$RUNNER_TEMP/cert/dist.p12" -out "$RUNNER_TEMP/cert/dist.p12.enc" -pass "pass:$P"
          rm "$RUNNER_TEMP/cert/dist.p12"
          echo "cert=$CID" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.cert.outputs.cert != ''
        with:
          name: dist-cert
          path: ${{ runner.temp }}/cert/dist.p12.enc
          retention-days: 1
      - name: Publish status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash native/scripts/push-status.sh "$RUNNER_TEMP/st"

  build:
    needs: setup
    if: needs.setup.outputs.matrix != '[]'
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: dist-cert
          path: ${{ runner.temp }}/cert
      - name: Build and upload
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
          TEAM_ID: ${{ needs.setup.outputs.team }}
          CERT_ID: ${{ needs.setup.outputs.cert }}
          APP: ${{ matrix.app }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/st"
          bash native/scripts/build-ios.sh 2>&1 | tee "$RUNNER_TEMP/build.log"
          RC=${PIPESTATUS[0]}
          { echo "app: $APP  run: $GITHUB_RUN_NUMBER  rc: $RC  $(date -u)"; grep -E "^(STEP|RESULT|ERROR)" "$RUNNER_TEMP/build.log"; echo "---- errors ----"; grep -iE "error:|❌|failed|No suitable|ITMS|code signing|provision" "$RUNNER_TEMP/build.log" | grep -v "^STEP" | head -60; echo "---- tail ----"; tail -80 "$RUNNER_TEMP/build.log"; } > "$RUNNER_TEMP/st/build-$APP.txt"
          exit $RC
      - name: Publish status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash native/scripts/push-status.sh "$RUNNER_TEMP/st"
