name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/android/**'
      - 'native/branch/**'
      - 'native/cashier/**'
      - 'native/attendance/**'
      - 'native/inventory/**'
      - 'native/plugins/**'
      - 'native/loader/**'
      - 'native/scripts/build-android.sh'
      - '.github/workflows/android.yml'

concurrency:
  group: android-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  branch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
          APP: branch
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/st"
          bash native/scripts/build-android.sh 2>&1 | tee "$RUNNER_TEMP/build.log"
          RC=${PIPESTATUS[0]}
          { echo "android branch run: $GITHUB_RUN_NUMBER rc: $RC $(date -u)"; grep -E "^(STEP|RESULT|ERROR)" "$RUNNER_TEMP/build.log"; echo "---- errors ----"; grep -iE "error|FAILED|What went wrong" "$RUNNER_TEMP/build.log" | head -60; echo "---- tail ----"; tail -60 "$RUNNER_TEMP/build.log"; } > "$RUNNER_TEMP/st/build-android-branch.txt"
          exit $RC
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-branch >/dev/null 2>&1 || gh release create android-branch --title "RQ Branch (Android)" --notes "RQ Branch screen app for Android POS devices (Sunmi). Install the APK on the device."
          gh release upload android-branch "$RUNNER_TEMP/RQ-Branch.apk" --clobber
          echo "RESULT: published" >> "$RUNNER_TEMP/st/build-android-branch.txt"
      - name: Publish status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash native/scripts/push-status.sh "$RUNNER_TEMP/st"

  cashier:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
          APP: cashier
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/st"
          bash native/scripts/build-android.sh 2>&1 | tee "$RUNNER_TEMP/build.log"
          RC=${PIPESTATUS[0]}
          { echo "android cashier run: $GITHUB_RUN_NUMBER rc: $RC $(date -u)"; grep -E "^(STEP|RESULT|ERROR)" "$RUNNER_TEMP/build.log"; echo "---- errors ----"; grep -iE "error|FAILED|What went wrong" "$RUNNER_TEMP/build.log" | head -60; echo "---- tail ----"; tail -60 "$RUNNER_TEMP/build.log"; } > "$RUNNER_TEMP/st/build-android-cashier.txt"
          exit $RC
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-cashier >/dev/null 2>&1 || gh release create android-cashier --title "RQ Cashier (Android)" --notes "RQ Kitchen cashier app for Android phones, tablets and POS devices. Download the APK and install it."
          gh release upload android-cashier "$RUNNER_TEMP/RQ-Cashier.apk" --clobber
          echo "RESULT: published" >> "$RUNNER_TEMP/st/build-android-cashier.txt"
      - name: Publish status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash native/scripts/push-status.sh "$RUNNER_TEMP/st"

  staff:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: attendance
            apk: RQ-Attendance.apk
            title: "RQ Attendance (Android)"
            notes: "RQ Kitchen staff attendance (clock in / clock out) app for Android. Download the APK and install it."
          - app: inventory
            apk: RQ-Inventory.apk
            title: "RQ Inventory (Android)"
            notes: "RQ Kitchen stock count app for Android phones and tablets. Download the APK and install it."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
          APP: ${{ matrix.app }}
        run: |
          set +e
          bash native/scripts/build-android.sh 2>&1 | tee "$RUNNER_TEMP/build.log"
          RC=${PIPESTATUS[0]}
          grep -E "^(RESULT|ERROR)" "$RUNNER_TEMP/build.log" | while IFS= read -r l; do echo "::warning title=android ${{ matrix.app }}::$l"; done
          exit $RC
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-${{ matrix.app }} >/dev/null 2>&1 || gh release create android-${{ matrix.app }} --title "${{ matrix.title }}" --notes "${{ matrix.notes }}"
          gh release upload android-${{ matrix.app }} "$RUNNER_TEMP/${{ matrix.apk }}" --clobber
          echo "::warning title=android ${{ matrix.app }}::published"
