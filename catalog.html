<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RQ Kitchen · Menu Catalog</title>
<meta name="robots" content="noindex">
<meta name="description" content="RQ Kitchen full menu with photos and prices, for delivery partners (Talabat, Keeta, Noon, Deliveroo).">
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<style>
/* Layout: an orange brand band, a sticky action bar (Excel / photos / print), then one section per category: a grid of product cards (photo, EN + AR name, description, price). Built to be read by delivery-partner onboarding teams and printed to PDF. */
:root{
  --orange:#F29835; --orange-deep:#B85F0A; --ink:#1B1612; --paper:#FFFFFF; --cream:#FFF6EC; --line:#EFE3D6; --muted:#6E6054; --ok:#1F7A45;
  --display:"Lalezar","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --latin:"Fraunces",Georgia,serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* brand band */
.band{background:var(--orange);padding-block:28px 26px;padding-top:calc(28px + env(safe-area-inset-top,0px))}
.band .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{width:96px;height:96px;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:0 0 0 4px var(--paper),0 0 0 6px var(--ink);flex:0 0 auto}
.logo img{width:78%}
.band h1{margin:0;font-family:var(--latin);font-weight:700;font-size:clamp(26px,4.4vw,40px);line-height:1.05;letter-spacing:-.01em}
.band h1 span{display:block;font-family:var(--display);font-weight:400;font-size:.62em;letter-spacing:0;margin-top:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:14px}
.meta b{font-variant-numeric:tabular-nums}

/* action bar */
.actions{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);padding-block:12px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--paper)}
.actions .wrap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;min-height:42px;background:var(--cream);color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.org{background:var(--orange);color:var(--ink)}
.btn:disabled{opacity:.55;cursor:progress}
.btn svg{width:18px;height:18px;flex:0 0 auto}
.jump{margin-inline-start:auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:0 0 auto;text-decoration:none;color:var(--ink);font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.jump a:hover{background:var(--cream)}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* sections */
main{padding-block:10px 40px}
.cat{padding-top:30px}
.cat-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:3px solid var(--ink);padding-bottom:6px;margin-bottom:16px;flex-wrap:wrap}
.cat-h h2{margin:0;font-family:var(--latin);font-weight:700;font-size:clamp(22px,3vw,28px);line-height:1.1}
.cat-h h2 span{font-family:var(--display);font-weight:400;font-size:.92em;color:var(--orange-deep);margin-inline-start:10px}
.cat-h small{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0;break-inside:avoid;background:var(--paper)}
.ph{aspect-ratio:1/1;background:var(--cream);display:grid;place-items:center;padding:14px;position:relative}
.ph img{max-height:100%;object-fit:contain}
.ph img.photo{width:100%;height:100%;object-fit:cover;border-radius:10px}
.ph .none{font-size:13px;color:var(--muted);text-align:center}
.ph .dl{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:var(--paper);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.ph .dl svg{width:16px;height:16px}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.en{font-family:var(--latin);font-weight:600;font-size:16px;line-height:1.2}
.ar{font-family:var(--display);font-size:19px;line-height:1.2;direction:rtl;text-align:right}
.desc{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.row{display:flex;align-items:baseline;justify-content:space-between;margin-top:auto;padding-top:8px;gap:8px}
.price{font-family:var(--latin);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.price small{font-family:var(--body);font-size:12px;font-weight:700;color:var(--orange-deep);margin-left:4px}
.code{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}

/* branches */
.branches{margin-top:36px;border-top:3px solid var(--ink);padding-top:14px}
.branches h2{margin:0 0 12px;font-family:var(--latin);font-size:22px}
.btab{width:100%;border-collapse:collapse;font-size:14px}
.btab th,.btab td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.btab th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.btab td.ar{font-family:var(--body);font-size:14px}
.tablewrap{overflow-x:auto}
.foot{color:var(--muted);font-size:13px;padding-block:24px 40px}
.state{padding:60px 0;text-align:center;color:var(--muted)}
.state button{margin-top:10px}

@media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ar{font-size:16px}.en{font-size:14px}.price{font-size:17px}.jump{margin-inline-start:0}}
@media print{
  .actions,.ph .dl,body::before{display:none!important}
  .band{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ph{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .grid{grid-template-columns:repeat(4,1fr);gap:10px}
  .cat{break-inside:auto;padding-top:18px}
  .cat-h{break-after:avoid}
  body{font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="logo"><img src="/logo.png" alt="RQ Kitchen"></div>
    <div>
      <h1>RQ Kitchen Menu<span>المنيو الكامل · الصور والأسعار</span></h1>
      <div class="meta" id="meta"><span>Loading menu…</span></div>
    </div>
  </div>
</header>

<div class="actions">
  <div class="wrap">
    <button class="btn pri" id="xls" type="button" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13l4 5M12 13l-4 5"/></svg>Download Excel</button>
    <button class="btn org" id="zip" type="button" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>Download all photos (ZIP)</button>
    <button class="btn" id="pdf" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7"/></svg>Print / PDF</button>
    <span class="prog" id="prog" aria-live="polite"></span>
    <nav class="jump" id="jump" aria-label="Categories"></nav>
  </div>
</div>

<main class="wrap" id="main"><div class="state">Loading menu…</div></main>

<script>
var SB='https://dhqgorvtwgzekmmjztyr.supabase.co', KEY='sb_publishable_yAYV8YXgiq3DxyJZPqELXw_QbzvL5Fe';
function api(p){return fetch(SB+'/rest/v1/'+p,{headers:{apikey:KEY,Accept:'application/json'},cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function abs(s){if(!s)return '';if(/^(data:|https?:)/.test(s))return s;return location.origin+'/'+s.replace(/^\//,'');}
function isPhoto(s){return /(\.jpe?g($|\?)|^data:image\/jpe?g|combo_photo)/i.test(s||'');}
function slug(s){return String(s||'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'item';}
function money(n){n=Number(n);return n%1?n.toFixed(2):String(n);}
function hm(t){var a=String(t||'').split(':'),h=+a[0],m=a[1]||'00',ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+m+' '+ap;}
var DL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';

var CATS=[],ITEMS=[],BR=[];
function load(){
  Promise.all([api('menu_categories?select=*'),api('menu_items?select=*&active=eq.true'),api('menu_branches?select=name,name_ar,address,open_time,close_time,sort')])
  .then(function(r){
    var items=r[1];
    CATS=r[0].slice().sort(function(a,b){return a.sort-b.sort;}).map(function(c){
      var list=items.filter(function(i){return i.category_id===c.id;}).sort(function(a,b){return (a.sort||0)-(b.sort||0);});
      return{id:c.id,en:c.name_en||'',ar:(c.name_ar&&c.name_ar!==c.name_en)?c.name_ar:'',items:list};
    }).filter(function(c){return c.items.length;});
    ITEMS=[];CATS.forEach(function(c,ci){c.items.forEach(function(i,k){
      var code='RQ-'+String(ci+1).padStart(2,'0')+String(k+1).padStart(2,'0');
      i._code=code;i._cat=c;i._file=i.image?(String(ci+1).padStart(2,'0')+'-'+slug(c.en)+'/'+code+'-'+slug(i.name)+'.jpg'):'';ITEMS.push(i);});});
    BR=(r[2]||[]).filter(function(b){return b.address;}).sort(function(a,b){return a.sort-b.sort;});
    render();
  }).catch(function(){document.getElementById('main').innerHTML='<div class="state">Could not load the menu. Check the internet connection.<br><button class="btn pri" type="button" onclick="load()">Try again</button></div>';});
}
function render(){
  var upd=ITEMS.reduce(function(m,i){var v=i.updated_at||i.created_at,t=v?(Date.parse(v)||0):0;return t>m?t:m;},0);
  document.getElementById('meta').innerHTML='<span><b>'+ITEMS.length+'</b> products</span><span><b>'+CATS.length+'</b> categories</span><span>Prices in <b>AED</b>, VAT inclusive</span>'+(upd?'<span>Last updated <b>'+new Date(upd).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+'</b></span>':'');
  document.getElementById('jump').innerHTML=CATS.map(function(c){return '<a href="#c-'+esc(c.id)+'">'+esc(c.en)+'</a>';}).join('');
  var html=CATS.map(function(c){
    return '<section class="cat" id="c-'+esc(c.id)+'"><div class="cat-h"><h2>'+esc(c.en)+(c.ar?'<span>'+esc(c.ar)+'</span>':'')+'</h2><small>'+c.items.length+(c.items.length===1?' item':' items')+'</small></div><div class="grid">'+
      c.items.map(function(i){var src=abs(i.image);
        return '<article class="card"><div class="ph">'+(src?'<img src="'+esc(src)+'" alt="'+esc(i.name)+'" loading="lazy" crossorigin="anonymous"'+(isPhoto(src)?' class="photo"':'')+'><button class="dl" type="button" data-id="'+esc(i.id)+'" aria-label="Download photo of '+esc(i.name)+'" title="Download photo">'+DL+'</button>':'<div class="none">No photo</div>')+'</div>'+
          '<div class="body"><div class="en">'+esc(i.name)+'</div>'+(i.name_ar?'<div class="ar">'+esc(i.name_ar)+'</div>':'')+(i.ingredients?'<div class="desc">'+esc(i.ingredients)+'</div>':'')+
          '<div class="row"><span class="price">'+money(i.price)+'<small>AED</small></span><span class="code">'+i._code+'</span></div></div></article>';}).join('')+'</div></section>';
  }).join('');
  if(BR.length)html+='<section class="branches"><h2>Branches</h2><div class="tablewrap"><table class="btab"><thead><tr><th>Branch</th><th>الفرع</th><th>Location</th><th>Hours</th></tr></thead><tbody>'+
    BR.map(function(b){return '<tr><td>'+esc(b.name)+'</td><td class="ar" dir="rtl">'+esc(b.name_ar)+'</td><td>'+esc(b.address)+'</td><td>'+hm(b.open_time)+' – '+hm(b.close_time)+'</td></tr>';}).join('')+'</tbody></table></div></section>';
  html+='<p class="foot">RQ Kitchen · Good Food, Bigger Mood · This page always shows the current menu and prices.</p>';
  document.getElementById('main').innerHTML=html;
  document.getElementById('xls').disabled=false;document.getElementById('zip').disabled=false;
}

/* ---- libraries, loaded only when needed ---- */
var libs={};
function lib(url,globalName){if(window[globalName])return Promise.resolve(window[globalName]);if(libs[url])return libs[url];
  libs[url]=new Promise(function(res,rej){var s=document.createElement('script');s.src=url;s.onload=function(){res(window[globalName]);};s.onerror=function(){libs[url]=null;rej(new Error('lib'));};document.head.appendChild(s);});return libs[url];}
function save(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);}
var prog=document.getElementById('prog');
function today(){return new Date().toISOString().slice(0,10);}

/* product photo → 1000×1000 JPG on white, product centred */
var SIDE=1000;
function toJpg(src){return new Promise(function(res,rej){var im=new Image();im.crossOrigin='anonymous';im.onload=function(){
    var c=document.createElement('canvas');c.width=c.height=SIDE;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,SIDE,SIDE);
    x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';
    var photo=isPhoto(src),box=photo?SIDE:SIDE*.86,s=photo?Math.max(box/im.width,box/im.height):Math.min(box/im.width,box/im.height),w=im.width*s,h=im.height*s;
    x.drawImage(im,(SIDE-w)/2,(SIDE-h)/2,w,h);c.toBlob(function(b){b?res(b):rej(new Error('blob'));},'image/jpeg',.92);};
  im.onerror=function(){rej(new Error('img'));};im.src=src;});}

document.getElementById('main').addEventListener('click',function(e){var b=e.target.closest('.dl');if(!b)return;var i=ITEMS.find(function(x){return String(x.id)===b.dataset.id;});if(!i)return;
  toJpg(abs(i.image)).then(function(bl){save(bl,i._code+'-'+slug(i.name)+'.jpg');}).catch(function(){prog.textContent='Could not prepare that photo.';});});

document.getElementById('xls').onclick=function(){var btn=this;btn.disabled=true;prog.textContent='Preparing Excel…';
  lib('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','XLSX').then(function(X){
    var rows=ITEMS.map(function(i){return{'Item code':i._code,'Category (EN)':i._cat.en,'Category (AR)':i._cat.ar||'','Item name (EN)':i.name,'Item name (AR)':i.name_ar||'','Description / ingredients (EN)':i.ingredients||'','Price (AED, incl. VAT)':Number(i.price),'Photo file (in ZIP)':i._file,'Photo link':abs(i.image)&&!/^data:/.test(i.image)?abs(i.image):''};});
    var ws=X.utils.json_to_sheet(rows);ws['!cols']=[{wch:10},{wch:16},{wch:14},{wch:34},{wch:26},{wch:70},{wch:12},{wch:44},{wch:60}];
    var wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'Menu');
    if(BR.length){var b=X.utils.json_to_sheet(BR.map(function(r){return{'Branch':r.name,'Branch (AR)':r.name_ar,'Location':r.address,'Opens':hm(r.open_time),'Closes':hm(r.close_time)};}));b['!cols']=[{wch:16},{wch:18},{wch:30},{wch:10},{wch:10}];X.utils.book_append_sheet(wb,b,'Branches');}
    var out=X.write(wb,{bookType:'xlsx',type:'array'});save(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'RQ-Kitchen-Menu-'+today()+'.xlsx');prog.textContent='Excel downloaded.';
  }).catch(function(){prog.textContent='Could not build the Excel file. Try again.';}).finally(function(){btn.disabled=false;});};

document.getElementById('zip').onclick=function(){var btn=this;btn.disabled=true;prog.textContent='Preparing photos…';
  lib('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js','JSZip').then(function(JSZip){
    var z=new JSZip(),list=ITEMS.filter(function(i){return i.image;}),done=0,fail=[];
    return list.reduce(function(p,i){return p.then(function(){return toJpg(abs(i.image)).then(function(bl){z.file(i._file,bl);}).catch(function(){fail.push(i.name);}).then(function(){done++;prog.textContent='Photos '+done+' / '+list.length;});});},Promise.resolve())
    .then(function(){z.file('README.txt','RQ Kitchen menu photos, '+today()+'\r\nEach photo is 1000x1000 JPG on a white background.\r\nFile names start with the item code used in the Excel sheet (RQ-0101, ...).\r\n'+(fail.length?'\r\nMissing: '+fail.join(', ')+'\r\n':''));
      return z.generateAsync({type:'blob'});})
    .then(function(b){save(b,'RQ-Kitchen-Menu-Photos-'+today()+'.zip');prog.textContent=fail.length?'Downloaded. '+fail.length+' photo(s) could not be added.':'Photos downloaded.';});
  }).catch(function(){prog.textContent='Could not build the ZIP. Try again.';}).finally(function(){btn.disabled=false;});};

document.getElementById('pdf').onclick=function(){window.print();};
load();
</script>
</body>
</html>
